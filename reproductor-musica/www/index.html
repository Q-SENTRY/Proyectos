<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f4f2ee">
<title>Reproductor</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f4f2ee;--fg:#161616;--mute:#8b8880;--line:#e4e1da;--card:#ffffff;--soft:#ebe8e1;--shadow:0 10px 30px rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#0f0f0f;--fg:#efeeea;--mute:#7c7a74;--line:#232322;--card:#1a1a19;--soft:#222220;--shadow:0 10px 30px rgba(0,0,0,.5)}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;user-select:none}
button{background:none;border:0;color:inherit;font:inherit;cursor:pointer}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
svg.f{fill:currentColor;stroke:none}
.ib{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;transition:background .15s}
.ib:active{background:var(--soft)}

/* Vistas */
.view{position:absolute;inset:0;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top)) 20px calc(110px + env(safe-area-inset-bottom));transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .32s}
.view.hidden{transform:translateX(30%);opacity:0;pointer-events:none}
.view.behind{transform:translateX(-12%);opacity:0;pointer-events:none}
.top{display:flex;align-items:center;justify-content:space-between;height:44px;margin-bottom:12px}
.top .left{display:flex;align-items:center;gap:4px;margin-left:-10px}
h1{font-size:32px;font-weight:700;letter-spacing:-.03em;margin:8px 0 4px}
.sub{color:var(--mute);font-size:13px;margin-bottom:22px}
.label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:26px 0 12px;display:flex;justify-content:space-between;align-items:center}
.label button{font-size:11px;letter-spacing:.14em;color:var(--fg)}

/* Carpetas */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.folder{position:relative;aspect-ratio:1/1.05;border-radius:18px;padding:16px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;color:#161616;transition:transform .15s}
.folder:active{transform:scale(.97)}
.folder .fi{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.55);display:grid;place-items:center}
.folder .fi svg{width:18px;height:18px}
.folder b{font-size:16px;font-weight:650;letter-spacing:-.01em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.folder small{font-size:12px;opacity:.6}
.folder.new{background:transparent;border:1.5px dashed var(--line);color:var(--mute);align-items:center;justify-content:center;gap:8px}
.folder.new .fi{background:var(--soft)}

/* Canciones */
.song{display:flex;align-items:center;gap:14px;padding:10px 0;width:100%;text-align:left}
.art{width:46px;height:46px;border-radius:10px;flex-shrink:0;display:grid;place-items:center;color:rgba(22,22,22,.55);font-weight:700;font-size:15px}
.song .info{flex:1;min-width:0}
.song .t{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song .a{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.song.active .t{color:var(--fg)}
.song.active .art{box-shadow:0 0 0 2px var(--fg)}
.eq{display:none;gap:2px;align-items:flex-end;height:14px}
.song.active .eq{display:flex}
.eq i{width:3px;background:var(--fg);border-radius:2px;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
.paused .eq i{animation-play-state:paused}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}
.more{color:var(--mute)}
.empty{text-align:center;color:var(--mute);padding:50px 10px}
.empty svg{width:40px;height:40px;stroke-width:1.2;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:12px 22px;border-radius:999px;background:var(--fg);color:var(--bg);font-weight:600;font-size:14px}
.btn svg{width:18px;height:18px}
.actions{display:flex;gap:10px;margin-bottom:8px}
.pill{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:14px;background:var(--card);font-weight:600;font-size:14px;box-shadow:0 1px 0 var(--line)}
.pill.dark{background:var(--fg);color:var(--bg)}
.pill svg{width:18px;height:18px}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:0 14px;height:44px;color:var(--mute)}
.search input{flex:1;border:0;background:none;outline:none;color:var(--fg);font:inherit}

/* Mini reproductor */
.mini{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));background:var(--card);border-radius:18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;padding:8px 8px 8px 8px;transform:translateY(150%);transition:transform .35s cubic-bezier(.2,.8,.2,1);overflow:hidden;z-index:5}
.mini.show{transform:none}
.mini .art{width:44px;height:44px}
.mini .info{flex:1;min-width:0}
.mini .t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .a{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .prog{position:absolute;left:0;bottom:0;height:2px;background:var(--fg);width:0}

/* Reproductor completo */
.player{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 26px calc(28px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.player.open{transform:none}
.player .top{margin-left:-10px;margin-right:-10px}
.player .top span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.cover{margin:18px auto 0;width:100%;max-width:360px;aspect-ratio:1;border-radius:24px;display:grid;place-items:center;position:relative;transition:transform .5s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow)}
.paused .cover{transform:scale(.9)}
.cover .big{font-size:96px;font-weight:800;letter-spacing:-.05em;color:rgba(22,22,22,.18)}
.meta{margin-top:34px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.meta div{min-width:0}
.meta .t{font-size:23px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .a{color:var(--mute);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:12px;padding:6px 12px;border-radius:999px;background:var(--soft);white-space:nowrap;display:flex;align-items:center;gap:6px}
.chip svg{width:14px;height:14px}
.bar{margin-top:26px;height:26px;display:flex;align-items:center;touch-action:none;cursor:pointer}
.track{position:relative;width:100%;height:4px;border-radius:4px;background:var(--line)}
.fill{position:absolute;inset:0 auto 0 0;background:var(--fg);border-radius:4px;width:0}
.knob{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--fg);transform:translate(-50%,-50%) scale(.7);left:0;transition:transform .15s}
.bar:active .knob{transform:translate(-50%,-50%) scale(1.1)}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;margin-top:2px}
.controls{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:20px}
.controls .ib{width:48px;height:48px}
.controls .ib.off{color:var(--mute)}
.controls .ib.on{color:var(--fg);background:var(--soft)}
.controls .skip svg{width:30px;height:30px}
.play{width:76px;height:76px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;transition:transform .15s}
.play:active{transform:scale(.93)}
.play svg{width:30px;height:30px}

/* Hojas y diálogos */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:24px 24px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom));z-index:21;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-height:80vh;overflow-y:auto}
.sheet.show{transform:none}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 16px}
.sheet h3{font-size:17px;font-weight:650;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet p{color:var(--mute);font-size:13px;margin-bottom:14px}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:13px 4px;text-align:left;border-radius:12px;font-weight:500}
.opt:active{background:var(--soft)}
.opt .dot{width:22px;height:22px;border-radius:7px}
.opt.sel::after{content:"✓";margin-left:auto;font-weight:700}
.opt.danger{color:#d0473a}
.sheet input{width:100%;height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);padding:0 16px;font:inherit;font-size:16px;outline:none;margin:6px 0 16px}
.sheet input:focus{border-color:var(--fg)}
.colors{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.colors button{width:36px;height:36px;border-radius:50%;transition:transform .15s}
.colors button.sel{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--fg)}
.row{display:flex;gap:10px}
.row button{flex:1;padding:14px;border-radius:14px;font-weight:600;background:var(--soft)}
.row button.pri{background:var(--fg);color:var(--bg)}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translate(-50%,-150%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;z-index:30;transition:transform .3s}
.toast.show{transform:translate(-50%,0)}
input[type=file]{display:none}
/* ---- Animaciones ---- */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.85)}70%{transform:scale(1.03)}100%{opacity:1;transform:none}}
.anim .song{animation:rise .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*35ms)}
.anim .folder{animation:pop .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*50ms)}
h1,.sub,.search{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.sub{animation-delay:.05s}.search{animation-delay:.1s}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.18;transform:scale(0);animation:rip .55s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(2.6);opacity:0}}
.song,.opt,.pill,.ib,.play,.folder{position:relative;overflow:hidden}
.song{border-radius:12px;transition:background .2s}
.song:active{background:var(--soft)}
.glow{position:absolute;inset:-20%;z-index:-1;filter:blur(70px);opacity:.55;transition:background 1s;pointer-events:none}
@media (prefers-color-scheme:dark){.glow{opacity:.25}}
.player{isolation:isolate;overflow:hidden}
.cover{touch-action:pan-y}
.cover.out-l{animation:outL .22s ease-in forwards}.cover.out-r{animation:outR .22s ease-in forwards}
.cover.in-l{animation:inL .42s cubic-bezier(.2,.8,.2,1)}.cover.in-r{animation:inR .42s cubic-bezier(.2,.8,.2,1)}
@keyframes outL{to{transform:translateX(-60%) rotate(-6deg);opacity:0}}
@keyframes outR{to{transform:translateX(60%) rotate(6deg);opacity:0}}
@keyframes inL{from{transform:translateX(60%) rotate(6deg);opacity:0}}
@keyframes inR{from{transform:translateX(-60%) rotate(-6deg);opacity:0}}
.meta .t,.meta .a{transition:opacity .25s,transform .25s}
.swap .meta .t,.swap .meta .a{opacity:0;transform:translateY(6px)}
.waves{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:4px;align-items:flex-end;height:28px;opacity:.5;transition:opacity .4s}
.paused .waves{opacity:0}
.waves i{width:4px;border-radius:3px;background:rgba(22,22,22,.55);animation:eq 1.1s ease-in-out infinite}
.waves i:nth-child(2){animation-delay:-.2s}.waves i:nth-child(3){animation-delay:-.5s}.waves i:nth-child(4){animation-delay:-.8s}.waves i:nth-child(5){animation-delay:-.35s}
.paused .waves i{animation-play-state:paused}
.play{transition:transform .2s,border-radius .3s}
body:not(.paused) .play{border-radius:26px}
.pi{transition:transform .25s}.pi.bump{transform:scale(.6)}
.mini .art{transition:transform .4s}
body:not(.paused) .mini .art{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.06)}}
.mini.bounce{animation:mb .5s cubic-bezier(.2,.8,.2,1)}
@keyframes mb{40%{transform:translateY(-8px)}}
.player.dragging{transition:none}
.sheet .opt{animation:rise .35s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*30ms)}

/* ---- v4: escaneo, artistas, orden, carátulas ---- */
.art{overflow:hidden;background-size:cover;background-position:center}
.art img,.cover img{width:100%;height:100%;object-fit:cover;display:block;animation:fadein .4s}
@keyframes fadein{from{opacity:0}}
.cover{overflow:hidden}.cover img{position:absolute;inset:0;border-radius:inherit}
.scan{display:flex;align-items:center;gap:14px;margin-top:18px;padding:16px;border-radius:18px;background:var(--fg);color:var(--bg);width:100%;text-align:left;animation:rise .5s .15s cubic-bezier(.2,.8,.2,1) both}
.scan .ic{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;flex-shrink:0}
.scan b{display:block;font-size:15px}.scan small{opacity:.7;font-size:12.5px}
.scan.busy .ic svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.artists{display:flex;gap:14px;overflow-x:auto;margin:0 -20px;padding:2px 20px 6px;scrollbar-width:none}
.artists::-webkit-scrollbar{display:none}
.artist{flex-shrink:0;width:72px;text-align:center;animation:pop .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*40ms)}
.artist .av{width:64px;height:64px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:20px;color:rgba(22,22,22,.55);transition:transform .2s,box-shadow .2s}
.artist.sel .av{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--fg);transform:scale(1.04)}
.artist span{font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:6px}
.chips button{font-size:12px;letter-spacing:0;text-transform:none;padding:6px 12px;border-radius:999px;color:var(--mute);background:transparent;transition:background .2s,color .2s}
.chips button.sel{background:var(--fg);color:var(--bg)}
.dur{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.song.active .dur{display:none}
.hello{font-size:13px;color:var(--mute)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body class="paused">

<!-- Biblioteca -->
<section class="view" id="vHome">
  <div class="top">
    <span class="hello" id="hello">Hola</span>
    <div style="display:flex;margin-right:-10px">
      <button class="ib" id="rescan" title="Buscar música en el teléfono" style="display:none"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button>
      <button class="ib" id="addHome" title="Añadir canciones"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
  </div>
  <h1>Tu música</h1>
  <div class="sub" id="stats">0 canciones</div>
  <button class="scan" id="scanCard" style="display:none"><div class="ic"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M8 11h6M11 8v6"/></svg></div><div><b id="scanT">Encontrar mi música</b><small id="scanS">Detecta las canciones guardadas en tu teléfono</small></div></button>
  <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Buscar canciones o artistas"></div>
  <div id="artistBox"><div class="label"><span>Artistas</span></div><div class="artists" id="artists"></div></div>
  <div class="label"><span>Carpetas</span></div>
  <div class="grid" id="folders"></div>
  <div class="label"><span id="recentLabel">Canciones</span><div class="chips" id="sort"><button data-s="az" class="sel">A–Z</button><button data-s="recent">Recientes</button><button data-s="artist">Artista</button></div></div>
  <div id="allSongs"></div>
</section>

<!-- Carpeta -->
<section class="view hidden" id="vFolder">
  <div class="top">
    <div class="left"><button class="ib" id="back"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button></div>
    <button class="ib" id="folderMore"><svg viewBox="0 0 24 24" class="f"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
  </div>
  <h1 id="fName">Carpeta</h1>
  <div class="sub" id="fStats"></div>
  <div class="actions">
    <button class="pill dark" id="fPlay"><svg viewBox="0 0 24 24" class="f"><path d="M8 5v14l11-7z"/></svg>Reproducir</button>
    <button class="pill" id="fShuffle"><svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>Aleatorio</button>
  </div>
  <div id="fSongs"></div>
</section>

<!-- Mini -->
<div class="mini" id="mini">
  <div class="art" id="mArt"></div>
  <div class="info"><div class="t" id="mT"></div><div class="a" id="mA"></div></div>
  <button class="ib" id="mPlay"><svg viewBox="0 0 24 24" class="f pi"><path d="M8 5v14l11-7z"/></svg></button>
  <button class="ib" id="mNext"><svg viewBox="0 0 24 24" class="f"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
  <div class="prog" id="mProg"></div>
</div>

<!-- Reproductor -->
<section class="player" id="player">
  <div class="glow" id="glow"></div>
  <div class="top">
    <button class="ib" id="close"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
    <span id="pFrom">Reproduciendo</span>
    <button class="ib" id="pMore"><svg viewBox="0 0 24 24" class="f"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
  </div>
  <div class="cover" id="cover"><span class="big" id="cBig"></span><div class="waves"><i></i><i></i><i></i><i></i><i></i></div></div>
  <div class="meta">
    <div><div class="t" id="pT"></div><div class="a" id="pA"></div></div>
    <button class="chip" id="pFolder"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span id="pFolderName">Sin carpeta</span></button>
  </div>
  <div class="bar" id="bar"><div class="track"><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div></div>
  <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  <div class="controls">
    <button class="ib off" id="shuffle"><svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
    <button class="ib skip" id="prev"><svg viewBox="0 0 24 24" class="f"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button class="play" id="play"><svg viewBox="0 0 24 24" class="f pi"><path d="M8 5v14l11-7z"/></svg></button>
    <button class="ib skip" id="next"><svg viewBox="0 0 24 24" class="f"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    <button class="ib off" id="repeat"><svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></svg></button>
  </div>
</section>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<input type="file" id="file" accept="audio/*" multiple>
<audio id="audio" preload="metadata"></audio>
<script src="capacitor.js"></script>

<script>
const $ = id => document.getElementById(id);
const audio = $('audio');
const COLORS = ['#e8d5c4','#c9d8c5','#c7d3e3','#e3c9d3','#ded7b8','#d3cbe6','#bfdcd8','#e6c7b5'];
const ICON_FOLDER = '<svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
const PLAY = '<path d="M8 5v14l11-7z"/>', PAUSE = '<path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/>';
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => isFinite(s) ? Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0') : '0:00';
const hash = s => [...s].reduce((h,c)=>(h*31+c.charCodeAt(0))|0,0);
const songColor = s => COLORS[Math.abs(hash(s.artist+s.title)) % COLORS.length];
const initials = s => (s.title.match(/[\p{L}\p{N}]/u)||['♪'])[0].toUpperCase();

/* ---------- Almacenamiento (IndexedDB) ---------- */
let db;
const openDB = () => new Promise((res, rej) => {
  const r = indexedDB.open('reproductor', 1);
  r.onupgradeneeded = () => { r.result.createObjectStore('songs',{keyPath:'id'}); r.result.createObjectStore('folders',{keyPath:'id'}); };
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
const tx = (store, mode='readonly') => db.transaction(store, mode).objectStore(store);
const all = store => new Promise(r => { const q = tx(store).getAll(); q.onsuccess = () => r(q.result); q.onerror = () => r([]); });
const put = (store, v) => new Promise(r => { const q = tx(store,'readwrite').put(v); q.onsuccess = q.onerror = r; });
const del = (store, id) => new Promise(r => { const q = tx(store,'readwrite').delete(id); q.onsuccess = q.onerror = r; });
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

let songs = [], folders = [];
let queue = [], qi = -1, current = null, urls = new Map();
let shuffle = false, repeat = false, openFolder = null, addTarget = null, query = '';

const urlFor = s => {
  if (s.uri) return window.Capacitor.convertFileSrc(s.uri);
  if (!urls.has(s.id)) urls.set(s.id, URL.createObjectURL(s.blob)); return urls.get(s.id);
};
const artHTML = s => s.art ? `<img src="${s.art}" alt="">` : esc(initials(s));
const fmtMs = ms => ms ? fmt(ms/1000) : '';
let sortMode = 'az', artistSel = null;
try { sortMode = localStorage.getItem('sort') || 'az'; } catch {}
function sorted(list){
  const l = list.slice();
  if (sortMode === 'az') l.sort((a,b) => a.title.localeCompare(b.title, 'es', {sensitivity:'base'}));
  if (sortMode === 'recent') l.sort((a,b) => b.added - a.added);
  if (sortMode === 'artist') l.sort((a,b) => a.artist.localeCompare(b.artist,'es') || a.title.localeCompare(b.title,'es'));
  return l;
}
function visibleSongs(){
  let l = songs;
  if (artistSel) l = l.filter(s => s.artist === artistSel);
  if (query) l = l.filter(s => (s.title+' '+s.artist+' '+(s.album||'')).toLowerCase().includes(query));
  return sorted(l);
}
const folderOf = id => folders.find(f => f.id === id);
const inFolder = fid => fid === '__all' ? songs : songs.filter(s => s.folder === fid);

/* ---------- Render ---------- */
function songRow(s,i=0){
  const active = current && current.id === s.id;
  return `<div class="song${active?' active':''}" data-id="${s.id}" style="--i:${Math.min(i,14)}">
    <div class="art" data-art="${s.id}" style="background:${songColor(s)}">${artHTML(s)}</div>
    <div class="info"><div class="t">${esc(s.title)}</div><div class="a">${esc(s.artist)}${s.folder && !openFolder ? ' · '+esc(folderOf(s.folder)?.name||'') : ''}</div></div>
    <span class="dur">${fmtMs(s.duration)}</span><span class="eq"><i></i><i></i><i></i></span>
    <button class="ib more" data-more="${s.id}"><svg viewBox="0 0 24 24" class="f"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg></button>
  </div>`;
}
const emptyBox = (msg) => `<div class="empty"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><div>${msg}</div><button class="btn" data-add="1"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Añadir canciones</button></div>`;

function render(){
  $('stats').textContent = `${songs.length} ${songs.length===1?'canción':'canciones'} · ${folders.length} ${folders.length===1?'carpeta':'carpetas'}`;
  $('folders').innerHTML =
    `<button class="folder" data-folder="__all" style="background:#d9d6cf"><div class="fi"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div><div><b>Todas</b><small>${songs.length} canciones</small></div></button>` +
    folders.map((f,i) => `<button class="folder" data-folder="${f.id}" style="background:${f.color};--i:${i+1}"><div class="fi">${ICON_FOLDER}</div><div><b>${esc(f.name)}</b><small>${inFolder(f.id).length} canciones</small></div></button>`).join('') +
    `<button class="folder new" id="newFolder" style="--i:${folders.length+1}"><div class="fi"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div><b style="font-size:14px">Nueva carpeta</b></button>`;
  const h = new Date().getHours();
  $('hello').textContent = h < 6 ? 'Buenas noches' : h < 12 ? 'Buenos días' : h < 20 ? 'Buenas tardes' : 'Buenas noches';
  const byArtist = {};
  songs.forEach(s => { if (s.artist !== 'Artista desconocido') (byArtist[s.artist] = byArtist[s.artist] || []).push(s); });
  const arts = Object.keys(byArtist).sort((a,b) => byArtist[b].length - byArtist[a].length).slice(0, 20);
  $('artistBox').style.display = arts.length > 1 ? '' : 'none';
  $('artists').innerHTML = arts.map((a,i) => `<button class="artist${artistSel===a?' sel':''}" data-artist="${esc(a)}" style="--i:${i}"><div class="av" style="background:${songColor({artist:a,title:''})}">${esc((a.match(/[\p{L}\p{N}]/u)||['♪'])[0].toUpperCase())}</div><span>${esc(a)}</span></button>`).join('');
  document.querySelectorAll('#sort button').forEach(b => b.classList.toggle('sel', b.dataset.s === sortMode));
  const list = visibleSongs();
  $('recentLabel').textContent = query || artistSel ? `${artistSel || 'Resultados'} (${list.length})` : `Canciones (${list.length})`;
  $('allSongs').innerHTML = list.length ? list.map((s,i)=>songRow(s,i)).join('') : (query ? '<div class="empty">Sin resultados</div>' : emptyBox('Aún no tienes música'));
  if (openFolder) renderFolder();
  loadArtworks();
}
function renderFolder(){
  const isAll = openFolder === '__all';
  const f = folderOf(openFolder);
  if (!isAll && !f) return closeFolder();
  const list = inFolder(openFolder);
  $('fName').textContent = isAll ? 'Todas' : f.name;
  $('fStats').textContent = `${list.length} ${list.length===1?'canción':'canciones'}`;
  $('folderMore').style.visibility = isAll ? 'hidden' : 'visible';
  $('fSongs').innerHTML = list.length ? sorted(list).map((s,i)=>songRow(s,i)).join('') : emptyBox('Esta carpeta está vacía');
}
function renderNow(){
  if (!current) { $('mini').classList.remove('show'); return; }
  const s = current, c = songColor(s), f = folderOf(s.folder);
  $('mini').classList.add('show');
  $('mArt').style.background = c; $('mArt').innerHTML = artHTML(s);
  $('mT').textContent = s.title; $('mA').textContent = s.artist;
  $('pT').textContent = s.title; $('pA').textContent = s.artist;
  $('cover').style.background = c; $('cBig').textContent = s.art ? '' : initials(s); $('cover').querySelector('img')?.remove(); if (s.art) $('cover').insertAdjacentHTML('afterbegin', `<img src="${s.art}" alt="">`); $('glow').style.background = `radial-gradient(circle at 50% 30%, ${c}, transparent 60%)`;
  $('pFolderName').textContent = f ? f.name : 'Sin carpeta';
  document.querySelectorAll('.song').forEach(el => el.classList.toggle('active', el.dataset.id === s.id));
}

/* ---------- Navegación ---------- */
function animate(el){ el.classList.remove('anim'); void el.offsetWidth; el.classList.add('anim'); setTimeout(()=>el.classList.remove('anim'),1200); }
function showFolder(id){ openFolder = id; renderFolder(); animate($('vFolder')); $('vFolder').classList.remove('hidden'); $('vHome').classList.add('behind'); $('vFolder').scrollTop = 0; }
function closeFolder(){ openFolder = null; $('vFolder').classList.add('hidden'); $('vHome').classList.remove('behind'); render(); }
$('back').onclick = closeFolder;
$('mini').onclick = e => { if (!e.target.closest('button')) $('player').classList.add('open'); };
$('close').onclick = () => $('player').classList.remove('open');

document.addEventListener('click', e => {
  const more = e.target.closest('[data-more]');
  if (more) { e.stopPropagation(); return songSheet(songs.find(s => s.id === more.dataset.more)); }
  if (e.target.closest('[data-add]')) return pickFiles(openFolder && openFolder !== '__all' ? openFolder : null);
  if (e.target.closest('#newFolder')) return folderSheet();
  const ar = e.target.closest('[data-artist]');
  if (ar) { artistSel = artistSel === ar.dataset.artist ? null : ar.dataset.artist; return render(); }
  const so = e.target.closest('[data-s]');
  if (so) { sortMode = so.dataset.s; try { localStorage.setItem('sort', sortMode); } catch {} render(); animate($('vHome')); return; }
  const fo = e.target.closest('[data-folder]');
  if (fo) return showFolder(fo.dataset.folder);
  const row = e.target.closest('.song');
  if (row) {
    const ctx = row.closest('#fSongs') ? sorted(inFolder(openFolder)) : visibleSongs();
    playList(ctx, ctx.findIndex(s => s.id === row.dataset.id));
  }
});
$('q').oninput = e => { query = e.target.value.trim().toLowerCase(); render(); };

/* ---------- Añadir canciones ---------- */
function parse(name){
  const base = name.replace(/\.[^.]+$/, '').replace(/_/g,' ').trim();
  const p = base.split(' - ');
  return p.length > 1 ? {artist:p[0].trim(), title:p.slice(1).join(' - ').trim()} : {artist:'Artista desconocido', title:base};
}
function pickFiles(folder){ addTarget = folder; $('file').click(); }
$('addHome').onclick = () => pickFiles(null);
$('file').onchange = async e => {
  const files = [...e.target.files]; e.target.value = '';
  for (const f of files) {
    const s = {id:uid(), ...parse(f.name), blob:f, folder:addTarget, added:Date.now()};
    await put('songs', s); songs.push(s);
  }
  render();
  toast(`${files.length} ${files.length===1?'canción añadida':'canciones añadidas'}`);
};

/* ---------- Hojas ---------- */
function openSheet(html){ $('sheet').innerHTML = '<div class="grab"></div>' + html; $('sheet').querySelectorAll('.opt').forEach((o,i)=>o.style.setProperty('--i',Math.min(i,12))); $('sheet').classList.add('show'); $('scrim').classList.add('show'); }
function closeSheet(){ $('sheet').classList.remove('show'); $('scrim').classList.remove('show'); }
$('scrim').onclick = closeSheet;

function folderSheet(edit){
  let color = edit ? edit.color : COLORS[folders.length % COLORS.length];
  openSheet(`<h3>${edit?'Editar carpeta':'Nueva carpeta'}</h3><p>Organiza tus canciones por categoría</p>
    <input id="fInput" maxlength="30" placeholder="Ej. Rock, Para entrenar, Relax" value="${edit?esc(edit.name):''}">
    <div class="colors">${COLORS.map(c=>`<button data-c="${c}" style="background:${c}" class="${c===color?'sel':''}"></button>`).join('')}</div>
    <div class="row"><button id="sCancel">Cancelar</button><button class="pri" id="sOk">${edit?'Guardar':'Crear'}</button></div>`);
  setTimeout(() => $('fInput').focus(), 300);
  $('sheet').querySelector('.colors').onclick = e => { const b = e.target.closest('[data-c]'); if (!b) return; color = b.dataset.c; $('sheet').querySelectorAll('.colors button').forEach(x => x.classList.toggle('sel', x===b)); };
  $('sCancel').onclick = closeSheet;
  $('sOk').onclick = async () => {
    const name = $('fInput').value.trim(); if (!name) return $('fInput').focus();
    const f = edit ? Object.assign(edit, {name, color}) : {id:uid(), name, color, created:Date.now()};
    await put('folders', f); if (!edit) folders.push(f);
    closeSheet(); render(); renderNow(); toast(edit ? 'Carpeta actualizada' : `Carpeta "${name}" creada`);
  };
}

function moveSheet(s){
  openSheet(`<h3>Mover a carpeta</h3><p>${esc(s.title)}</p>
    <button class="opt${!s.folder?' sel':''}" data-mv=""><span class="dot" style="background:var(--soft)"></span>Sin carpeta</button>
    ${folders.map(f=>`<button class="opt${s.folder===f.id?' sel':''}" data-mv="${f.id}"><span class="dot" style="background:${f.color}"></span>${esc(f.name)}</button>`).join('')}
    <button class="opt" id="mvNew"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Nueva carpeta</button>`);
  $('sheet').onclick = async e => {
    if (e.target.closest('#mvNew')) { $('sheet').onclick = null; return folderSheet(); }
    const b = e.target.closest('[data-mv]'); if (!b) return;
    s.folder = b.dataset.mv || null; await put('songs', s);
    $('sheet').onclick = null; closeSheet(); render(); renderNow();
    toast(s.folder ? `Movida a "${folderOf(s.folder).name}"` : 'Quitada de la carpeta');
  };
}

function songSheet(s){
  if (!s) return;
  openSheet(`<h3>${esc(s.title)}</h3><p>${esc(s.artist)}</p>
    <button class="opt" data-a="play"><svg viewBox="0 0 24 24" class="f"><path d="M8 5v14l11-7z"/></svg>Reproducir</button>
    <button class="opt" data-a="next"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7M17 15v6M14 18h6"/></svg>Reproducir a continuación</button>
    <button class="opt" data-a="move">${ICON_FOLDER}Mover a carpeta</button>
    <button class="opt" data-a="rename"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>Renombrar</button>
    <button class="opt danger" data-a="del"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>${s.uri ? 'Ocultar de la biblioteca' : 'Eliminar de la biblioteca'}</button>`);
  $('sheet').onclick = async e => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    $('sheet').onclick = null;
    const a = b.dataset.a;
    if (a === 'play') { closeSheet(); playList([s], 0); }
    if (a === 'next') { closeSheet(); if (!current) playList([s],0); else { queue.splice(qi+1, 0, s); toast('Sonará a continuación'); } }
    if (a === 'move') moveSheet(s);
    if (a === 'rename') renameSheet(s);
    if (a === 'del') {
      if (s.uri) { s.hidden = true; await put('songs', s); } else await del('songs', s.id);
      songs = songs.filter(x => x.id !== s.id);
      queue = queue.filter(x => x.id !== s.id);
      if (current && current.id === s.id) { audio.pause(); audio.removeAttribute('src'); current = null; renderNow(); }
      closeSheet(); render(); toast('Canción eliminada');
    }
  };
}

function renameSheet(s){
  openSheet(`<h3>Renombrar</h3><p>Título y artista</p>
    <input id="rT" value="${esc(s.title)}" placeholder="Título"><input id="rA" value="${esc(s.artist)}" placeholder="Artista" style="margin-top:-6px">
    <div class="row"><button id="sCancel">Cancelar</button><button class="pri" id="sOk">Guardar</button></div>`);
  $('sCancel').onclick = closeSheet;
  $('sOk').onclick = async () => {
    s.title = $('rT').value.trim() || s.title; s.artist = $('rA').value.trim() || 'Artista desconocido';
    await put('songs', s); closeSheet(); render(); renderNow();
  };
}

function folderActions(){
  const f = folderOf(openFolder); if (!f) return;
  openSheet(`<h3>${esc(f.name)}</h3><p>${inFolder(f.id).length} canciones</p>
    <button class="opt" data-a="add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Añadir canciones del teléfono</button>
    <button class="opt" data-a="pick"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Elegir de la biblioteca</button>
    <button class="opt" data-a="edit"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>Editar nombre y color</button>
    <button class="opt danger" data-a="del"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>Eliminar carpeta</button>`);
  $('sheet').onclick = async e => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    $('sheet').onclick = null;
    const a = b.dataset.a;
    if (a === 'add') { closeSheet(); pickFiles(f.id); }
    if (a === 'edit') folderSheet(f);
    if (a === 'pick') pickSheet(f);
    if (a === 'del') {
      for (const s of inFolder(f.id)) { s.folder = null; await put('songs', s); }
      await del('folders', f.id); folders = folders.filter(x => x.id !== f.id);
      closeSheet(); closeFolder(); renderNow(); toast('Carpeta eliminada (las canciones se conservan)');
    }
  };
}
$('folderMore').onclick = folderActions;

function pickSheet(f){
  const sel = new Set(inFolder(f.id).map(s => s.id));
  openSheet(`<h3>Añadir a "${esc(f.name)}"</h3><p>Toca para seleccionar</p>
    ${songs.length ? songs.map(s=>`<button class="opt${sel.has(s.id)?' sel':''}" data-pk="${s.id}"><span class="dot" style="background:${songColor(s)}"></span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.title)}</span></button>`).join('') : '<p>No hay canciones en la biblioteca</p>'}
    <div class="row" style="margin-top:12px"><button class="pri" id="sOk">Listo</button></div>`);
  $('sheet').onclick = e => { const b = e.target.closest('[data-pk]'); if (!b) return; const id = b.dataset.pk; sel.has(id) ? sel.delete(id) : sel.add(id); b.classList.toggle('sel'); };
  $('sOk').onclick = async () => {
    for (const s of songs) {
      const want = sel.has(s.id);
      if (want && s.folder !== f.id) { s.folder = f.id; await put('songs', s); }
      if (!want && s.folder === f.id) { s.folder = null; await put('songs', s); }
    }
    $('sheet').onclick = null; closeSheet(); render(); renderNow();
  };
}
$('pFolder').onclick = () => current && moveSheet(current);
$('pMore').onclick = () => current && songSheet(current);

/* ---------- Reproducción ---------- */
function playList(list, i, shuf){
  if (!list.length) return;
  queue = list.slice();
  if (shuf) { for (let k = queue.length-1; k > 0; k--) { const j = Math.floor(Math.random()*(k+1)); [queue[k],queue[j]] = [queue[j],queue[k]]; } i = 0; }
  qi = Math.max(0, i);
  const name = openFolder ? (openFolder === '__all' ? 'Todas' : folderOf(openFolder)?.name) : 'Biblioteca';
  $('pFrom').textContent = 'Desde ' + (name || 'Biblioteca');
  load(true);
}
let dir = 0;
function load(autoplay){
  const prevSong = current;
  current = queue[qi]; if (!current) return;
  audio.src = urlFor(current);
  const pl = $('player'), cv = $('cover');
  if (prevSong && pl.classList.contains('open') && dir && !document.hidden) {
    cv.className = 'cover ' + (dir > 0 ? 'out-l' : 'out-r'); pl.classList.add('swap');
    setTimeout(() => { renderNow(); cv.className = 'cover ' + (dir > 0 ? 'in-l' : 'in-r'); pl.classList.remove('swap'); }, 220);
  } else { renderNow(); if (!prevSong) { $('mini').classList.remove('bounce'); void $('mini').offsetWidth; $('mini').classList.add('bounce'); } }
  dir = 0;
  native.meta(current);
  if (autoplay) audio.play().catch(()=>{});
}
function toggle(){ if (!current) return songs.length ? playList(songs,0) : pickFiles(null); audio.paused ? audio.play() : audio.pause(); }
function next(){
  if (!queue.length) return; dir = 1;
  if (shuffle && queue.length > 1) qi = (qi + 1 + Math.floor(Math.random()*(queue.length-1))) % queue.length;
  else qi = (qi + 1) % queue.length;
  load(true);
}
function prev(){
  if (!queue.length) return;
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  dir = -1; qi = (qi - 1 + queue.length) % queue.length; load(true);
}
$('play').onclick = toggle; $('mPlay').onclick = toggle;
$('next').onclick = next; $('mNext').onclick = next; $('prev').onclick = prev;
$('fPlay').onclick = () => playList(sorted(inFolder(openFolder)), 0);
$('fShuffle').onclick = () => playList(inFolder(openFolder), 0, true);
$('shuffle').onclick = e => { shuffle = !shuffle; e.currentTarget.className = 'ib ' + (shuffle?'on':'off'); toast(shuffle?'Aleatorio activado':'Aleatorio desactivado'); };
$('repeat').onclick = e => { repeat = !repeat; e.currentTarget.className = 'ib ' + (repeat?'on':'off'); toast(repeat?'Repetir canción':'Repetir desactivado'); };

const setIcons = p => document.querySelectorAll('.pi').forEach(el => { el.classList.add('bump'); setTimeout(()=>{ el.innerHTML = p ? PAUSE : PLAY; el.classList.remove('bump'); },120); });
audio.onplay = () => { setIcons(true); document.body.classList.remove('paused'); native.state('playing'); };
audio.onpause = () => { setIcons(false); document.body.classList.add('paused'); native.state('paused'); };
audio.onended = () => { if (repeat) { audio.currentTime = 0; audio.play(); } else if (qi < queue.length-1 || shuffle) next(); };
audio.onplaying = () => console.log('REP play', current && current.title, audio.src.slice(0,60));
audio.onerror = () => { console.log('REP audio-error', audio.error && audio.error.code, audio.src.slice(0,80)); if (current) toast('No se pudo reproducir esta canción'); };
audio.onloadedmetadata = () => { $('dur').textContent = fmt(audio.duration); native.pos(); };
audio.onseeked = () => native.pos();
audio.ontimeupdate = () => {
  const p = audio.duration ? audio.currentTime / audio.duration * 100 : 0;
  $('mProg').style.width = p + '%';
  if (dragging) return;
  setBar(p); $('cur').textContent = fmt(audio.currentTime);
};
function setBar(p){ $('fill').style.width = p+'%'; $('knob').style.left = p+'%'; }
let dragging = false;
const bar = $('bar');
const pct = e => { const r = bar.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); };
bar.onpointerdown = e => { if (!audio.duration) return; dragging = true; bar.setPointerCapture(e.pointerId); setBar(pct(e)*100); };
bar.onpointermove = e => { if (dragging) { setBar(pct(e)*100); $('cur').textContent = fmt(pct(e)*audio.duration); } };
bar.onpointerup = e => { if (dragging) { audio.currentTime = pct(e)*audio.duration; dragging = false; } };

/* ---------- Segundo plano: pantalla bloqueada y notificación ---------- */
const NativeMS = window.Capacitor?.isNativePlatform?.() ? window.Capacitor.registerPlugin('MediaSession') : null;
const artCache = new Map();
function artwork(s){
  if (artCache.has(s.id)) return artCache.get(s.id);
  const c = document.createElement('canvas'); c.width = c.height = 512; const x = c.getContext('2d');
  x.fillStyle = songColor(s); x.fillRect(0,0,512,512);
  x.fillStyle = 'rgba(22,22,22,.22)'; x.font = '800 260px -apple-system,Roboto,sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(initials(s), 256, 276);
  const u = c.toDataURL('image/png'); artCache.set(s.id, u); return u;
}
const native = {
  meta(s){
    const m = {title:s.title, artist:s.artist, album:folderOf(s.folder)?.name || 'Reproductor', artwork:[{src:artwork(s), sizes:'512x512', type:'image/png'}]};
    try { if (NativeMS) NativeMS.setMetadata(m); else if ('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata(m); } catch {}
  },
  state(st){
    try { if (NativeMS) NativeMS.setPlaybackState({playbackState:st}); else if ('mediaSession' in navigator) navigator.mediaSession.playbackState = st; } catch {}
    this.pos();
  },
  pos(){
    if (!audio.duration || !isFinite(audio.duration)) return;
    const p = {duration:audio.duration, position:Math.min(audio.currentTime, audio.duration), playbackRate:1};
    try { if (NativeMS) NativeMS.setPositionState(p); else navigator.mediaSession?.setPositionState?.(p); } catch {}
  }
};
const handlers = {
  play: () => audio.play(), pause: () => audio.pause(), stop: () => audio.pause(),
  nexttrack: next, previoustrack: prev,
  seekto: d => { if (d && d.seekTime != null) { audio.currentTime = d.seekTime; native.pos(); } },
  seekforward: () => { audio.currentTime = Math.min(audio.duration||0, audio.currentTime + 10); },
  seekbackward: () => { audio.currentTime = Math.max(0, audio.currentTime - 10); }
};
for (const [action, fn] of Object.entries(handlers)) {
  try { if (NativeMS) NativeMS.setActionHandler({action}, fn); else navigator.mediaSession?.setActionHandler(action, fn); } catch {}
}

/* Efecto onda al tocar */
document.addEventListener('pointerdown', e => {
  const t = e.target.closest('.song,.opt,.pill,.ib,.play,.folder'); if (!t) return;
  const r = t.getBoundingClientRect(), d = Math.max(r.width, r.height), sp = document.createElement('span');
  sp.className = 'ripple'; sp.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
  t.appendChild(sp); setTimeout(() => sp.remove(), 600);
});

/* Gestos: deslizar portada para cambiar, bajar para cerrar */
(() => {
  const cv = $('cover'), pl = $('player'); let sx, sy, mode;
  cv.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; mode = null; }, {passive:true});
  cv.addEventListener('touchmove', e => {
    const dx = e.touches[0].clientX - sx, dy = e.touches[0].clientY - sy;
    if (!mode) mode = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    if (mode === 'x') cv.style.transform = `translateX(${dx}px) rotate(${dx/30}deg)`;
    else if (dy > 0) { pl.classList.add('dragging'); pl.style.transform = `translateY(${dy}px)`; }
  }, {passive:true});
  cv.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    cv.style.transform = ''; pl.classList.remove('dragging'); pl.style.transform = '';
    if (mode === 'x' && Math.abs(dx) > 70) dx < 0 ? next() : prev();
    if (mode === 'y' && dy > 120) pl.classList.remove('open');
  });
})();
setInterval(() => { if (!audio.paused) native.pos(); }, 5000);

/* Botón atrás de Android */
history.pushState(null, '');
window.addEventListener('popstate', () => {
  history.pushState(null, '');
  if ($('sheet').classList.contains('show')) closeSheet();
  else if ($('player').classList.contains('open')) $('player').classList.remove('open');
  else if (openFolder) closeFolder();
});

let tt;
function toast(m){ $('toast').textContent = m; $('toast').classList.add('show'); clearTimeout(tt); tt = setTimeout(() => $('toast').classList.remove('show'), 1800); }

/* ---------- Música del teléfono ---------- */
const Lib = window.Capacitor?.isNativePlatform?.() ? window.Capacitor.registerPlugin('MusicLibrary') : null;
let hiddenIds = new Set(), scanning = false;
async function scanDevice(interactive){
  if (!Lib || scanning) return;
  scanning = true; $('scanCard').classList.add('busy'); $('scanT').textContent = 'Buscando música…'; $('scanS').textContent = 'Revisando tu teléfono';
  try {
    const r = await Lib.scan();
    if (!r.granted) { if (interactive) toast('Necesito permiso para ver tu música'); return; }
    const found = new Map(r.songs.map(d => ['dev:'+d.id, d]));
    let added = 0;
    for (const [id, d] of found) {
      if (hiddenIds.has(id)) continue;
      const ex = songs.find(s => s.id === id);
      if (ex) { if (ex.uri !== d.uri) { ex.uri = d.uri; await put('songs', ex); } continue; }
      const s = {id, title:d.title || 'Sin título', artist:d.artist || 'Artista desconocido', album:d.album || '', albumId:d.albumId, duration:d.duration, uri:d.uri, folder:null, added:(d.added||0)*1000};
      await put('songs', s); songs.push(s); added++;
    }
    for (const s of songs.filter(s => s.uri && !found.has(s.id))) await del('songs', s.id);
    songs = songs.filter(s => !s.uri || found.has(s.id));
    console.log('REP scan ' + found.size + ' canciones, nuevas ' + added);
    try { localStorage.setItem('scanned', '1'); } catch {}
    render(); animate($('vHome'));
    if (interactive || added) toast(added ? `${added} ${added===1?'canción encontrada':'canciones encontradas'}` : 'Tu biblioteca está al día');
  } catch (e) { console.log('REP scan-error ' + e.message); toast('No se pudo leer la música'); }
  finally { scanning = false; $('scanCard').classList.remove('busy'); updateScanCard(); }
}
function updateScanCard(){
  if (!Lib) return;
  const has = songs.some(s => s.uri);
  $('rescan').style.display = has ? '' : 'none';
  $('scanCard').style.display = has ? 'none' : '';
  $('scanT').textContent = 'Encontrar mi música'; $('scanS').textContent = 'Detecta las canciones guardadas en tu teléfono';
}
$('scanCard').onclick = () => scanDevice(true);
$('rescan').onclick = () => scanDevice(true);

/* Carátulas reales (se cargan poco a poco y se guardan) */
let artBusy = false;
async function loadArtworks(){
  if (!Lib || artBusy) return; artBusy = true;
  try {
    for (const s of songs) {
      if (!s.uri || s.art !== undefined) continue;
      let data = null;
      try { data = (await Lib.artwork({uri:s.uri, albumId:s.albumId})).data || null; } catch {}
      s.art = data; await put('songs', s);
      if (data) {
        document.querySelectorAll(`[data-art="${s.id}"]`).forEach(el => el.innerHTML = `<img src="${data}" alt="">`);
        if (current && current.id === s.id) { renderNow(); native.meta(s); }
      }
    }
  } finally { artBusy = false; }
}
const _artwork = artwork;
artwork = s => s.art || _artwork(s);

(async () => {
  try {
    db = await openDB();
    let all_; [all_, folders] = await Promise.all([all('songs'), all('folders')]);
    hiddenIds = new Set(all_.filter(s => s.hidden).map(s => s.id));
    songs = all_.filter(s => !s.hidden);
    folders.sort((a,b)=>a.created-b.created);
  } catch { toast('No se pudo abrir el almacenamiento'); }
  render(); updateScanCard();
  if (Lib) {
    try {
      const st = await Lib.status();
      if (st.granted) scanDevice(false);
      else { let asked = null; try { asked = localStorage.getItem('scanned'); } catch {} if (!asked && !songs.length) setTimeout(() => scanDevice(true), 600); }
    } catch {}
  }
})();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js');
</script>
