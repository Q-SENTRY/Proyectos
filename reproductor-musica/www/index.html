<!doctype html>
<html lang="es" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f4f2ee">
<title>Reproductor</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
/* ---------- Tema ---------- */
:root{--bg:#f7f5f2;--fg:#17151a;--mute:#8c8794;--line:#e9e5df;--card:#ffffff;--soft:#efebe6;--shadow:0 12px 34px rgba(40,20,50,.10);--ac:var(--fg);--on-ac:var(--bg);--grad:var(--ac);--pc:#e3dcd3;--tint:rgba(238,77,123,.07)}
:root[data-theme=dark]{--bg:#0e0d12;--fg:#f3f1f6;--mute:#8a8594;--line:#26232c;--card:#17161c;--soft:#211f27;--shadow:0 12px 34px rgba(0,0,0,.55);--tint:rgba(238,77,123,.10)}
@media (prefers-color-scheme:dark){:root[data-theme=auto]{--bg:#0e0d12;--fg:#f3f1f6;--mute:#8a8594;--line:#26232c;--card:#17161c;--soft:#211f27;--shadow:0 12px 34px rgba(0,0,0,.55);--tint:rgba(238,77,123,.10)}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;user-select:none;transition:background .3s,color .3s}
button{background:none;border:0;color:inherit;font:inherit;cursor:pointer}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
svg.f{fill:currentColor;stroke:none}
.ib{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;transition:background .15s}
.ib:active{background:var(--soft)}

/* ---------- Vistas ---------- */
.view{position:absolute;inset:0;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top)) 20px calc(110px + env(safe-area-inset-bottom));transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .32s}
.view.hidden{transform:translateX(30%);opacity:0;pointer-events:none}
.view.behind{transform:translateX(-12%);opacity:0;pointer-events:none}
.top{display:flex;align-items:center;justify-content:space-between;height:44px;margin-bottom:12px}
.top .left{display:flex;align-items:center;gap:4px;margin-left:-10px}
.top .right{display:flex;margin-right:-10px}
h1{font-size:32px;font-weight:700;letter-spacing:-.03em;margin:8px 0 4px;word-break:break-word}
.sub{color:var(--mute);font-size:13px;margin-bottom:22px}
.hello{font-size:13px;color:var(--mute)}
.label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:26px 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.label > span{white-space:nowrap}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:0 14px;height:44px;color:var(--mute)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--fg);font:inherit}
.hscroll{display:flex;gap:14px;overflow-x:auto;margin:0 -20px;padding:2px 20px 6px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}

/* Carpetas */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.folder{position:relative;aspect-ratio:1/1.05;border-radius:18px;padding:16px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;color:#161616;transition:transform .15s}
.folder:active{transform:scale(.97)}
.folder .fi{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.55);display:grid;place-items:center}
.folder .fi svg{width:18px;height:18px}
.folder b{font-size:16px;font-weight:650;letter-spacing:-.01em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.folder small{font-size:12px;opacity:.6}
.folder.new{background:transparent;border:1.5px dashed var(--line);color:var(--mute);align-items:center;justify-content:center;gap:8px}
.folder.new .fi{background:var(--soft)}

/* Álbumes y artistas */
.album{flex-shrink:0;width:128px;text-align:left}
.album .ac{width:128px;height:128px;border-radius:14px;display:grid;place-items:center;font-size:40px;font-weight:800;color:rgba(22,22,22,.25);overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.08);transition:transform .2s}
.album:active .ac{transform:scale(.96)}
.album .ac img{width:100%;height:100%;object-fit:cover}
.album b{display:block;font-size:13px;font-weight:600;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.album small{display:block;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{flex-shrink:0;width:72px;text-align:center}
.artist .av{width:64px;height:64px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:20px;color:rgba(22,22,22,.55);overflow:hidden}
.artist .av img{width:100%;height:100%;object-fit:cover}
.artist span{font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Canciones */
.song{display:flex;align-items:center;gap:14px;padding:8px 6px;margin:0 -6px;text-align:left;border-radius:12px;transition:background .2s}
.song:active{background:var(--soft)}
.art{width:46px;height:46px;border-radius:10px;flex-shrink:0;display:grid;place-items:center;color:rgba(22,22,22,.55);font-weight:700;font-size:15px;overflow:hidden}
.art img,.cover img{width:100%;height:100%;object-fit:cover;display:block;animation:fadein .4s}
@keyframes fadein{from{opacity:0}}
.song .info{flex:1;min-width:0}
.song .t{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song .a{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.song.active .t{color:var(--ac)}
.song.active .art{box-shadow:0 0 0 2px var(--ac)}
.dur{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.song.active .dur{display:none}
.eq{display:none;gap:2px;align-items:flex-end;height:14px}
.song.active .eq{display:flex}
.eq i{width:3px;background:var(--ac);border-radius:2px;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
.paused .eq i{animation-play-state:paused}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}
.more{color:var(--mute)}
.empty{text-align:center;color:var(--mute);padding:50px 10px}
.empty svg{width:40px;height:40px;stroke-width:1.2;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:12px 22px;border-radius:999px;background:var(--grad);color:var(--on-ac);font-weight:600;font-size:14px}
.btn svg{width:18px;height:18px}
.actions{display:flex;gap:10px;margin-bottom:8px}
.pill{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:14px;background:var(--card);font-weight:600;font-size:14px;box-shadow:0 1px 0 var(--line)}
.pill.dark{background:var(--grad);color:var(--on-ac)}
.pill svg{width:18px;height:18px}
.chips{display:flex;gap:4px;flex-shrink:0}
.chips button{white-space:nowrap;font-size:12px;letter-spacing:0;text-transform:none;padding:6px 12px;border-radius:999px;color:var(--mute);transition:background .2s,color .2s}
.chips button.sel{background:var(--grad);color:var(--on-ac)}
.scan{display:flex;align-items:center;gap:14px;margin-top:18px;padding:16px;border-radius:18px;background:var(--grad);color:var(--on-ac);width:100%;text-align:left}
.scan .ic{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;flex-shrink:0}
.scan b{display:block;font-size:15px}.scan small{opacity:.7;font-size:12.5px}
.scan.busy .ic svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lhead{display:flex;gap:16px;align-items:flex-end;margin:4px 0 20px}
.lhead .ac{width:112px;height:112px;border-radius:16px;flex-shrink:0;display:grid;place-items:center;font-size:40px;font-weight:800;color:rgba(22,22,22,.25);overflow:hidden;box-shadow:var(--shadow)}
.lhead .ac img{width:100%;height:100%;object-fit:cover}
.lhead h1{font-size:26px;margin:0}
.lhead .sub{margin:4px 0 0}

/* Mini reproductor */
.mini{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));background:var(--card);border-radius:18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;padding:8px;transform:translateY(150%);transition:transform .35s cubic-bezier(.2,.8,.2,1);overflow:hidden;z-index:5}
.mini.show{transform:none}
.mini .art{width:44px;height:44px}
.mini .info{flex:1;min-width:0}
.mini .t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .a{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .prog{position:absolute;left:0;bottom:0;height:2px;background:var(--grad);width:0}
body:not(.paused) .mini .art{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.06)}}

/* Reproductor */
.player{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 26px calc(24px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .4s cubic-bezier(.2,.8,.2,1);isolation:isolate;overflow:hidden}
.player.open{transform:none}
.player.dragging{transition:none}
.player .top{margin:0 -10px}
.player .top span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.glow{position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,color-mix(in srgb,var(--pc) 75%,var(--bg)) 0%,color-mix(in srgb,var(--pc) 30%,var(--bg)) 45%,var(--bg) 85%);transition:background 1s}
:root[data-theme=dark] .glow{background:linear-gradient(180deg,color-mix(in srgb,var(--pc) 45%,var(--bg)) 0%,color-mix(in srgb,var(--pc) 14%,var(--bg)) 50%,var(--bg) 90%)}
@media (prefers-color-scheme:dark){:root[data-theme=auto] .glow{background:linear-gradient(180deg,color-mix(in srgb,var(--pc) 45%,var(--bg)) 0%,color-mix(in srgb,var(--pc) 14%,var(--bg)) 50%,var(--bg) 90%)}}
.cover{margin:14px auto 0;width:100%;max-width:340px;aspect-ratio:1;border-radius:24px;display:grid;place-items:center;position:relative;overflow:hidden;transition:transform .5s cubic-bezier(.2,.8,.2,1);box-shadow:0 20px 50px rgba(0,0,0,.18);touch-action:pan-y}
.cover img{position:absolute;inset:0}
.paused .cover{transform:scale(.92)}
.cover .big{font-size:96px;font-weight:800;letter-spacing:-.05em;color:rgba(22,22,22,.18)}
.cover.out-l{animation:outL .22s ease-in forwards}.cover.out-r{animation:outR .22s ease-in forwards}
.cover.in-l{animation:inL .42s cubic-bezier(.2,.8,.2,1)}.cover.in-r{animation:inR .42s cubic-bezier(.2,.8,.2,1)}
@keyframes outL{to{transform:translateX(-60%) rotate(-6deg);opacity:0}}
@keyframes outR{to{transform:translateX(60%) rotate(6deg);opacity:0}}
@keyframes inL{from{transform:translateX(60%) rotate(6deg);opacity:0}}
@keyframes inR{from{transform:translateX(-60%) rotate(-6deg);opacity:0}}
#viz{width:100%;max-width:340px;height:44px;margin:14px auto 0;display:block}
.meta{margin-top:10px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.meta > div{min-width:0}
.meta .t{font-size:23px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .a{color:var(--mute);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:12px;padding:6px 12px;border-radius:999px;background:color-mix(in srgb,var(--card) 70%,transparent);white-space:nowrap;display:flex;align-items:center;gap:6px;max-width:45%;overflow:hidden}
.chip span{overflow:hidden;text-overflow:ellipsis}
.chip svg{width:14px;height:14px}
.bar{margin-top:20px;height:26px;display:flex;align-items:center;touch-action:none;cursor:pointer}
.track{position:relative;width:100%;height:4px;border-radius:4px;background:color-mix(in srgb,var(--fg) 14%,transparent)}
.fill{position:absolute;inset:0 auto 0 0;background:var(--grad);border-radius:4px;width:0}
.knob{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--ac);transform:translate(-50%,-50%) scale(.7);left:0;transition:transform .15s}
.bar:active .knob{transform:translate(-50%,-50%) scale(1.1)}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;margin-top:2px}
.controls{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:14px}
.controls .ib{width:48px;height:48px}
.controls .ib.off{color:var(--mute)}
.controls .ib.on{color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent)}
.controls .skip svg{width:30px;height:30px}
.play{width:76px;height:76px;border-radius:50%;background:var(--grad);color:var(--on-ac);display:grid;place-items:center;transition:transform .2s,border-radius .3s}
.play:active{transform:scale(.93)}
body:not(.paused) .play{border-radius:26px}
.play svg{width:30px;height:30px}
.pi{transition:transform .25s}.pi.bump{transform:scale(.6)}
.subbar{display:flex;justify-content:space-between;margin:14px -10px 0}
.subbar .ib{color:var(--mute)}
.meta .t,.meta .a{transition:opacity .25s,transform .25s}
.swap .meta .t,.swap .meta .a{opacity:0;transform:translateY(6px)}

/* Hojas */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:24px 24px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom));z-index:21;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-height:85vh;overflow-y:auto}
.sheet.show{transform:none}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 16px}
.sheet h3{font-size:17px;font-weight:650;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet p{color:var(--mute);font-size:13px;margin-bottom:14px}
.sheet .sec{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:18px 0 10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:13px 4px;text-align:left;border-radius:12px;font-weight:500}
.opt:active{background:var(--soft)}
.opt .dot{width:22px;height:22px;border-radius:7px;flex-shrink:0}
.opt.sel::after{content:"✓";margin-left:auto;font-weight:700;color:var(--ac)}
.opt.check::after{content:"";margin-left:auto;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);flex-shrink:0}
.opt.check.sel::after{content:"✓";border-color:var(--ac);background:var(--ac);color:var(--on-ac);display:grid;place-items:center;font-size:13px}
.opt.danger{color:#d0473a}
.sheet input[type=text]{width:100%;height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);padding:0 16px;font:inherit;font-size:16px;outline:none;margin:4px 0 10px}
.sheet input[type=text]:focus{border-color:var(--ac)}
.sheet label.f{font-size:12px;color:var(--mute);display:block;margin-top:6px}
.colors{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.colors button{width:36px;height:36px;border-radius:50%;transition:transform .15s}
.colors button.sel{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--fg)}
.row{display:flex;gap:10px}
.row button{flex:1;padding:14px;border-radius:14px;font-weight:600;background:var(--soft)}
.row button.pri{background:var(--grad);color:var(--on-ac)}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px}
.seg button{flex:1;padding:9px;border-radius:10px;font-size:14px;font-weight:550;color:var(--mute);transition:background .2s,color .2s}
.seg button.sel{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.range{display:flex;align-items:center;gap:12px}
.range input{flex:1;accent-color:var(--ac)}
.range b{width:44px;text-align:right;font-variant-numeric:tabular-nums;font-size:14px}
.toggle{display:flex;align-items:center;justify-content:space-between;width:100%;padding:10px 0;text-align:left}
.toggle small{display:block;color:var(--mute);font-size:12px}
.sw{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:background .2s;flex-shrink:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on .sw{background:var(--grad)}.toggle.on .sw::after{transform:translateX(18px)}
.editart{display:flex;gap:14px;align-items:center;margin:6px 0 10px}
.editart .art{width:72px;height:72px;border-radius:14px;font-size:24px}
.editart .col{display:flex;flex-direction:column;gap:6px}
.editart button{font-size:14px;font-weight:600;color:var(--ac);text-align:left}

/* Cola */
.qrow{display:flex;align-items:center;gap:12px;padding:6px 0;background:var(--card);border-radius:12px;touch-action:pan-y}
.qrow .art{width:40px;height:40px}
.qrow .info{flex:1;min-width:0}
.qrow .t{font-weight:550;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .a{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow.now .t{color:var(--ac)}
.qrow.past{opacity:.45}
.qrow.drag{box-shadow:var(--shadow);z-index:2;position:relative;transform:scale(1.02)}
.handle{width:36px;height:40px;display:grid;place-items:center;color:var(--mute);touch-action:none;cursor:grab}
.qrow .x{color:var(--mute);width:36px;height:36px}

.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translate(-50%,-150%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;z-index:30;transition:transform .3s;max-width:90%;text-align:center}
.toast.show{transform:translate(-50%,0)}
input[type=file]{display:none}

/* ---- Diseño v6 ---- */
body{background:radial-gradient(120% 60% at 100% 0%,var(--tint),transparent 60%),radial-gradient(90% 50% at 0% 0%,color-mix(in srgb,#6f5bf5 6%,transparent),transparent 60%),var(--bg);background-attachment:fixed}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:30px;height:30px;border-radius:9px;box-shadow:0 4px 12px rgba(238,77,123,.35)}
.brand div{line-height:1.15}
.brand b{display:block;font-size:13px;font-weight:700;letter-spacing:-.01em}
h1{font-size:34px;letter-spacing:-.035em}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.search{border:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.03);transition:border-color .2s,box-shadow .2s}
.search:focus-within{border-color:color-mix(in srgb,var(--ac) 50%,var(--line));box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 12%,transparent)}
.label{font-weight:600}
.folder{box-shadow:0 6px 18px rgba(40,20,50,.08);background-image:linear-gradient(160deg,rgba(255,255,255,.45),rgba(255,255,255,0) 55%)}
.folder::after{content:"";position:absolute;right:-30px;bottom:-30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.22)}
.folder.new{box-shadow:none;background-image:none}.folder.new::after{display:none}
.folder[data-folder="__all"]{background:var(--grad)!important;color:#fff}
.folder[data-folder="__all"] .fi{background:rgba(255,255,255,.22)}
.folder[data-folder="__all"] small{opacity:.85}
.art{border-radius:12px}
.song{padding:9px 8px;margin:0 -8px}
.song.active{background:color-mix(in srgb,var(--ac) 8%,transparent)}
.album .ac{border-radius:16px;box-shadow:0 8px 20px rgba(40,20,50,.12)}
.artist .av{box-shadow:0 4px 12px rgba(40,20,50,.10)}
.scan{box-shadow:0 10px 26px color-mix(in srgb,var(--ac) 35%,transparent)}
.play{box-shadow:0 12px 28px color-mix(in srgb,var(--ac) 40%,transparent)}
.pill.dark{box-shadow:0 8px 20px color-mix(in srgb,var(--ac) 30%,transparent)}
.mini{background:color-mix(in srgb,var(--card) 78%,transparent);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);border:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.mini .prog{height:3px;border-radius:0 3px 3px 0}
.pbg{position:absolute;inset:-15%;z-index:-2;pointer-events:none;background-size:cover;background-position:center;filter:blur(60px) saturate(1.5);opacity:.5;transform:scale(1.1);transition:background-image .6s,opacity .6s}
:root[data-theme=dark] .pbg{opacity:.35}
@media (prefers-color-scheme:dark){:root[data-theme=auto] .pbg{opacity:.35}}
.cover{box-shadow:0 24px 60px color-mix(in srgb,var(--pc) 55%,rgba(0,0,0,.25))}
.controls .ib.on{color:var(--ac)}
.sheet{border-top:1px solid var(--line)}
.colors button.brand{background:linear-gradient(135deg,#FF9A5A,#EE4D7B 50%,#6F5BF5)}
.toast{background:color-mix(in srgb,var(--fg) 92%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.lhead .ac{border-radius:20px}
.folder.wa{background:linear-gradient(150deg,#5be38a,#1fae5b)!important;color:#fff}
.folder.wa .fi{background:rgba(255,255,255,.25)}.folder.wa small{opacity:.85}
.lhead .ac svg{width:46px;height:46px;stroke-width:1.5}
.lhead .ac.wa{background:linear-gradient(150deg,#5be38a,#1fae5b)!important;color:#fff}
.hint{font-size:13px;color:var(--mute);background:var(--soft);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.row button.danger-btn{background:#e0453a!important;color:#fff}
/* Animaciones */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.85)}70%{transform:scale(1.03)}100%{opacity:1;transform:none}}
.anim .song{animation:rise .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*35ms)}
.anim .folder,.anim .album,.anim .artist{animation:pop .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*45ms)}
.sheet.show .opt,.sheet.show .qrow{animation:rise .35s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*25ms)}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.18;transform:scale(0);animation:rip .55s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(2.6);opacity:0}}
.song,.opt,.pill,.ib,.play,.folder,.chips button{position:relative;overflow:hidden}
.mini.bounce{animation:mb .5s cubic-bezier(.2,.8,.2,1)}
@keyframes mb{40%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<script>
const $ = id => document.getElementById(id);
const COLORS = ['#e8d5c4','#c9d8c5','#c7d3e3','#e3c9d3','#ded7b8','#d3cbe6','#bfdcd8','#e6c7b5'];
const ACCENTS = [['brand','Marca'], ['', 'Neutro'], ['#e0533d','Coral'], ['#e8913a','Ámbar'], ['#3a9d6b','Verde'], ['#2f7fd6','Azul'], ['#7a5ad8','Violeta'], ['#d64f8e','Rosa']];
const ICON_FOLDER = '<svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
const ICON_NOTE = '<svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>';
const PLAY = '<path d="M8 5v14l11-7z"/>', PAUSE = '<path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/>';
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => isFinite(s) && s >= 0 ? Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0') : '0:00';
const fmtMs = ms => ms ? fmt(ms/1000) : '';
const hash = s => [...s].reduce((h,c)=>(h*31+c.charCodeAt(0))|0,0);
const colorOf = key => COLORS[Math.abs(hash(key)) % COLORS.length];
const songColor = s => colorOf(s.artist + s.title);
const firstChar = t => ((t||'').match(/\p{L}/u) || (t||'').match(/\p{N}/u) || ['♪'])[0].toUpperCase();
const initials = s => firstChar(s.title);
const artHTML = s => s.art ? `<img src="${s.art}" alt="">` : esc(initials(s));
const UNKNOWN_ARTIST = 'Artista desconocido', UNKNOWN_ALBUM = 'Sin álbum';
const ls = { get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } }, set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

/* ---------- Ajustes ---------- */
const settings = Object.assign({theme:'auto', accent:'brand', crossfade:4, viz:true, sort:'az'}, ls.get('settings', {}));
const saveSettings = () => ls.set('settings', settings);
function applyTheme(){
  document.documentElement.dataset.theme = settings.theme;
  const r = document.documentElement.style;
  if (settings.accent === 'brand') { r.setProperty('--ac', '#e8467c'); r.setProperty('--grad', 'linear-gradient(135deg,#FF9A5A,#EE4D7B 52%,#6F5BF5)'); r.setProperty('--on-ac', '#fff'); }
  else if (settings.accent) { r.setProperty('--ac', settings.accent); r.setProperty('--grad', settings.accent); r.setProperty('--on-ac', '#fff'); }
  else { r.removeProperty('--ac'); r.removeProperty('--grad'); r.removeProperty('--on-ac'); }
  const dark = settings.theme === 'dark' || (settings.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.querySelector('meta[name=theme-color]').content = dark ? '#0e0d12' : '#f7f5f2';
}
applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);

/* ---------- Almacenamiento (IndexedDB) ---------- */
let db;
const openDB = () => new Promise((res, rej) => {
  const r = indexedDB.open('reproductor', 1);
  r.onupgradeneeded = () => { r.result.createObjectStore('songs',{keyPath:'id'}); r.result.createObjectStore('folders',{keyPath:'id'}); };
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
const store = (name, mode='readonly') => db.transaction(name, mode).objectStore(name);
const all = name => new Promise(r => { const q = store(name).getAll(); q.onsuccess = () => r(q.result); q.onerror = () => r([]); });
const put = (name, v) => new Promise(r => { if (!db) return r(); const q = store(name,'readwrite').put(v); q.onsuccess = q.onerror = r; });
const del = (name, id) => new Promise(r => { if (!db) return r(); const q = store(name,'readwrite').delete(id); q.onsuccess = q.onerror = r; });
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

let songs = [], folders = [], hiddenIds = new Set();
let queue = [], qi = -1, current = null, blobUrls = new Map();
let shuffle = false, repeat = false, view = null, query = '';

const folderOf = id => folders.find(f => f.id === id);
/* WhatsApp: audios en carpetas de WhatsApp, archivos AUD-…-WA0001, o del teléfono con duración 0:00 */
const ICON_WA = '<svg viewBox="0 0 24 24"><path d="M20 11.5a8.5 8.5 0 0 1-12.6 7.4L3.5 20l1.2-3.7A8.5 8.5 0 1 1 20 11.5z"/><path d="M9 8.5c0 3 2.5 6.5 6 6.5l1-1.5-2-1-1 .8c-1-.4-2-1.4-2.4-2.4l.8-1-1-2z" stroke-width="1.3"/></svg>';
function isWA(s){
  if (s.waKeep) return false;
  if (/whatsapp/i.test(s.path || '')) return true;
  if (/(^|[-_ ])(AUD|PTT)-\d{8}-WA\d+/i.test(s.file || s.title || '')) return true;
  if (s.uri && (!s.duration || s.duration < 1000)) return true;
  return false;
}
const lib = () => songs.filter(s => !s.wa);
const waSongs = () => songs.filter(s => s.wa);
const songFolders = s => (s.folders || []).map(folderOf).filter(Boolean);
const urlFor = s => {
  if (s.uri) return window.Capacitor.convertFileSrc(s.uri);
  if (!blobUrls.has(s.id)) blobUrls.set(s.id, URL.createObjectURL(s.blob)); return blobUrls.get(s.id);
};

/* ---------- Búsqueda tolerante (sin tildes y con errores) ---------- */
const norm = t => String(t||'').normalize('NFD').replace(/\p{M}/gu, '').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
function lev(a, b){
  if (Math.abs(a.length - b.length) > 2) return 9;
  const d = Array.from({length:a.length+1}, (_,i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1), i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1] ? d[i-2][j-2]+1 : 9);
  return d[a.length][b.length];
}
function matchScore(s, q){
  const hay = norm(`${s.title} ${s.artist} ${s.album||''}`);
  if (!q) return 1;
  if (hay.includes(q)) return 3;
  const words = hay.split(' ');
  let score = 0;
  for (const tk of q.split(' ')) {
    if (hay.includes(tk)) { score += 2; continue; }
    if (tk.length < 3) return 0;
    const tol = tk.length >= 6 ? 2 : 1;
    if (words.some(w => lev(tk, w) <= tol || (w.length > tk.length && lev(tk, w.slice(0, tk.length)) <= tol - (tk.length < 5 ? 0 : 0)))) score += 1;
    else return 0;
  }
  return score;
}

/* ---------- Listas ---------- */
function sorted(list){
  const l = list.slice();
  if (settings.sort === 'az') l.sort((a,b) => a.title.localeCompare(b.title, 'es', {sensitivity:'base'}));
  if (settings.sort === 'recent') l.sort((a,b) => b.added - a.added);
  if (settings.sort === 'artist') l.sort((a,b) => a.artist.localeCompare(b.artist,'es') || a.title.localeCompare(b.title,'es'));
  return l;
}
function searchResults(){
  const q = norm(query);
  return songs.map(s => [s, matchScore(s, q)]).filter(x => x[1] > 0).sort((a,b) => b[1]-a[1] || a[0].title.localeCompare(b[0].title,'es')).map(x => x[0]);
}
function albumsList(){
  const m = new Map();
  for (const s of lib()) {
    if (!s.album) continue;
    const k = s.album + '\u0000' + (s.albumArtist || '');
    if (!m.has(k)) m.set(k, {key:k, name:s.album, songs:[]});
    m.get(k).songs.push(s);
  }
  return [...m.values()].map(a => { const ar = [...new Set(a.songs.map(s => s.artist))]; a.artist = ar.length === 1 ? ar[0] : 'Varios artistas'; a.art = (a.songs.find(s => s.art)||{}).art; return a; })
    .sort((a,b) => b.songs.length - a.songs.length || a.name.localeCompare(b.name,'es'));
}
function viewSongs(v){
  if (!v) return [];
  if (v.type === 'all') return sorted(lib());
  if (v.type === 'wa') return waSongs().sort((a,b) => b.added - a.added);
  if (v.type === 'folder') return sorted(songs.filter(s => (s.folders||[]).includes(v.id)));
  if (v.type === 'artist') return sorted(lib().filter(s => s.artist === v.id));
  if (v.type === 'album') return lib().filter(s => s.album === v.id).sort((a,b) => (a.track||0)-(b.track||0) || a.title.localeCompare(b.title,'es'));
  return [];
}

/* ---------- Render ---------- */
function songRow(s, i=0){
  const active = current && current.id === s.id;
  const fl = songFolders(s);
  const extra = view ? '' : (fl.length ? ' · ' + esc(fl.map(f => f.name).join(', ')) : '');
  return `<div class="song${active?' active':''}" data-id="${s.id}" style="--i:${Math.min(i,14)}">
    <div class="art" data-art="${s.id}" style="background:${songColor(s)}">${artHTML(s)}</div>
    <div class="info"><div class="t">${esc(s.title)}</div><div class="a">${esc(s.artist)}${extra}</div></div>
    <span class="dur">${fmtMs(s.duration)}</span><span class="eq"><i></i><i></i><i></i></span>
    <button class="ib more" data-more="${s.id}"><svg viewBox="0 0 24 24" class="f"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg></button>
  </div>`;
}
const emptyBox = msg => `<div class="empty">${ICON_NOTE}<div>${msg}</div><button class="btn" data-add="1"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Añadir canciones</button></div>`;

function render(){
  const h = new Date().getHours();
  $('hello').textContent = h < 6 ? 'Buenas noches' : h < 12 ? 'Buenos días' : h < 20 ? 'Buenas tardes' : 'Buenas noches';
  $('stats').textContent = `${lib().length} ${lib().length===1?'canción':'canciones'} · ${folders.length} ${folders.length===1?'carpeta':'carpetas'}`;
  // Artistas
  const byArtist = {};
  lib().forEach(s => { if (s.artist !== UNKNOWN_ARTIST) (byArtist[s.artist] = byArtist[s.artist] || []).push(s); });
  const arts = Object.keys(byArtist).sort((a,b) => byArtist[b].length - byArtist[a].length).slice(0, 20);
  $('artistBox').style.display = arts.length > 1 ? '' : 'none';
  $('artists').innerHTML = arts.map((a,i) => { const img = (byArtist[a].find(s => s.art)||{}).art;
    return `<button class="artist" data-artist="${esc(a)}" style="--i:${i}"><div class="av" style="background:${colorOf(a)}">${img?`<img src="${img}" alt="">`:esc(firstChar(a))}</div><span>${esc(a)}</span></button>`; }).join('');
  // Álbumes
  const albs = albumsList();
  $('albumBox').style.display = albs.length ? '' : 'none';
  $('albums').innerHTML = albs.slice(0, 30).map((a,i) => `<button class="album" data-album="${esc(a.name)}" style="--i:${i}"><div class="ac" style="background:${colorOf(a.name)}">${a.art?`<img src="${a.art}" alt="">`:esc(firstChar(a.name))}</div><b>${esc(a.name)}</b><small>${esc(a.artist)} · ${a.songs.length}</small></button>`).join('');
  // Carpetas
  $('folders').innerHTML =
    `<button class="folder" data-folder="__all" style="background:#d9d6cf"><div class="fi">${ICON_NOTE}</div><div><b>Todas</b><small>${lib().length} canciones</small></div></button>` +

/* ---------- Colores de la carátula ---------- */
const colorCache = new Map();
function dominantColor(src){
  if (colorCache.has(src)) return Promise.resolve(colorCache.get(src));
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      try {
        const c = document.createElement('canvas'); c.width = c.height = 32; const x = c.getContext('2d');
        x.drawImage(img, 0, 0, 32, 32);
        const d = x.getImageData(0, 0, 32, 32).data;
        let best = null, bs = -1, r=0,g=0,b=0,n=0;
        const buckets = {};
        for (let i = 0; i < d.length; i += 4) {
          const R=d[i],G=d[i+1],B=d[i+2]; r+=R; g+=G; b+=B; n++;
          const mx = Math.max(R,G,B), mn = Math.min(R,G,B), sat = mx ? (mx-mn)/mx : 0, lum = (mx+mn)/510;
          if (lum < .12 || lum > .92) continue;
          const k = (R>>5)+','+(G>>5)+','+(B>>5);
          const e = buckets[k] = buckets[k] || {c:0,r:0,g:0,b:0,s:0};
          e.c++; e.r+=R; e.g+=G; e.b+=B; e.s+=sat;
        }
        for (const e of Object.values(buckets)) { const sc = e.c * (0.3 + e.s/e.c); if (sc > bs) { bs = sc; best = e; } }
        const col = best ? `rgb(${Math.round(best.r/best.c)},${Math.round(best.g/best.c)},${Math.round(best.b/best.c)})` : `rgb(${Math.round(r/n)},${Math.round(g/n)},${Math.round(b/n)})`;
        colorCache.set(src, col); res(col);
      } catch { res(null); }
    };
    img.onerror = () => res(null);
    img.src = src;
  });
}

function resizeImage(file, size){
  return new Promise(res => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = size; const x = c.getContext('2d');
      const m = Math.min(img.width, img.height);
      x.drawImage(img, (img.width-m)/2, (img.height-m)/2, m, m, 0, 0, size, size);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(null); };
    img.src = url;
  });
}

/* ---------- Eliminar del teléfono ---------- */
function confirmDelete(list){
  if (!list.length) return;
  const one = list.length === 1;
  openSheet(`<h3>${one ? '¿Eliminar del teléfono?' : `¿Eliminar ${list.length} archivos del teléfono?`}</h3>
    <p>${one ? '“' + esc(list[0].title) + '” se borrará de tu teléfono.' : 'Se borrarán de tu teléfono.'} No se puede deshacer.${Lib && list.some(s => s.uri) ? ' Android te pedirá confirmar.' : ''}</p>
    ${list.slice(0, 5).map(s => `<div class="song" style="pointer-events:none"><div class="art" style="background:${songColor(s)}">${artHTML(s)}</div><div class="info"><div class="t">${esc(s.title)}</div><div class="a">${esc(s.artist)} · ${fmtMs(s.duration) || '0:00'}</div></div></div>`).join('')}
    ${list.length > 5 ? `<p>y ${list.length - 5} más…</p>` : ''}
    <div class="row" style="margin-top:12px"><button id="sCancel">Cancelar</button><button class="pri danger-btn" id="sOk">Eliminar</button></div>`);
  $('sCancel').onclick = closeSheet;
  $('sOk').onclick = () => { closeSheet(); deleteFromPhone(list); };
}
async function deleteFromPhone(list){
  const dev = list.filter(s => s.uri), local = list.filter(s => !s.uri);
  let gone = [...local];
  if (dev.length) {
    if (!Lib) return toast('Solo disponible en la app de Android');
    try {
      const r = await Lib.deleteFiles({uris: dev.map(s => s.uri)});
      console.log('REP delete ' + (r.deleted ? 'ok ' + dev.length : 'cancelado'));
      if (r.deleted) gone.push(...dev); else if (!local.length) return toast('No se eliminó nada');
    } catch (e) { console.log('REP delete-error ' + e.message); return toast('No se pudo eliminar'); }
  }
  const ids = new Set(gone.map(s => s.id));
  for (const s of gone) await del('songs', s.id);
  songs = songs.filter(s => !ids.has(s.id));
  if (current && ids.has(current.id)) { stopAll(); current = null; renderNow(); }
  queue = queue.filter(s => !ids.has(s.id)); if (current) qi = queue.findIndex(s => s.id === current.id);
  render();
  if (view && view.type === 'wa' && !waSongs().length) closeList();
  toast(gone.length === 1 ? 'Eliminada del teléfono' : `${gone.length} archivos eliminados`);
}

/* ---------- Cola de reproducción (ver, reordenar, quitar) ---------- */
function queueSheet(){
  if (!queue.length) return toast('La cola está vacía');
  const rows = queue.map((s,i) => `<div class="qrow${i===qi?' now':''}${i<qi?' past':''}" data-qi="${i}">
      <div class="handle" data-h="1"><svg viewBox="0 0 24 24"><path d="M8 6h.01M8 12h.01M8 18h.01M16 6h.01M16 12h.01M16 18h.01" stroke-width="3"/></svg></div>
      <div class="art" style="background:${songColor(s)}">${artHTML(s)}</div>
      <div class="info"><div class="t">${esc(s.title)}</div><div class="a">${i===qi ? 'Sonando ahora' : esc(s.artist)}</div></div>
      ${i===qi ? '' : `<button class="ib x" data-rm="${i}"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>`}
    </div>`).join('');
  openSheet(`<h3>Cola de reproducción</h3><p>${queue.length - qi - 1} por sonar · arrastra ⠿ para reordenar</p><div id="qList">${rows}</div>
    <div class="row" style="margin-top:14px"><button id="qClear">Vaciar siguientes</button><button class="pri" id="sOk">Listo</button></div>`);
  setTimeout(() => $('qList')?.querySelector('.now')?.scrollIntoView({block:'center'}), 320);
  $('sheet').onclick = e => {
    if (e.target.closest('#sOk')) return closeSheet();
    if (e.target.closest('#qClear')) { queue = queue.slice(0, qi+1); toast('Cola vaciada'); return queueSheet(); }
    const rm = e.target.closest('[data-rm]');
    if (rm) { const i = +rm.dataset.rm; queue.splice(i, 1); if (i < qi) qi--; return queueSheet(); }
    const row = e.target.closest('.qrow');
    if (row && !e.target.closest('.handle')) { const i = +row.dataset.qi; if (i !== qi) { qi = i; dir = 1; load(true); queueSheet(); } }
  };
  // Arrastrar para reordenar
  const list = $('qList');
  list.onpointerdown = e => {
    const h = e.target.closest('[data-h]'); if (!h) return;
    e.preventDefault();
    const row = h.closest('.qrow'), rowsEl = [...list.children], from = rowsEl.indexOf(row);
    const H = row.getBoundingClientRect().height, startY = e.clientY;
    let to = from;
    row.classList.add('drag'); h.setPointerCapture(e.pointerId);
    const move = ev => {
      const dy = ev.clientY - startY;
      row.style.transform = `translateY(${dy}px) scale(1.02)`;
      to = Math.max(0, Math.min(rowsEl.length-1, from + Math.round(dy / H)));
      rowsEl.forEach((r, i) => { if (r === row) return; let off = 0; if (from < to && i > from && i <= to) off = -H; if (from > to && i < from && i >= to) off = H; r.style.transition = 'transform .15s'; r.style.transform = off ? `translateY(${off}px)` : ''; });
    };
    const up = () => {
      h.removeEventListener('pointermove', move); h.removeEventListener('pointerup', up); h.removeEventListener('pointercancel', up);
      if (to !== from) {
        const cur = queue[qi], [item] = queue.splice(from, 1); queue.splice(to, 0, item);
        qi = queue.indexOf(cur);
      }
      queueSheet();
    };
    h.addEventListener('pointermove', move); h.addEventListener('pointerup', up); h.addEventListener('pointercancel', up);
  };
}
$('pQueue').onclick = queueSheet;

/* ---------- Motor de audio: dos reproductores para mezclar ---------- */
const players = [$('audioA'), $('audioB')];
let active = 0, fadingEl = null, fadeTarget = null, dir = 0;
const el = () => players[active];
const other = () => players[1 - active];
let actx = null, analyser = null;
function setupGraph(){
  if (actx || !settings.viz) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    actx = new AC();
    analyser = actx.createAnalyser(); analyser.fftSize = 128; analyser.smoothingTimeConstant = .8;
    analyser.connect(actx.destination);
    for (const p of players) { const src = actx.createMediaElementSource(p); const g = actx.createGain(); src.connect(g); g.connect(analyser); p._gain = g; }
  } catch (e) { console.log('REP viz-error ' + e.message); actx = null; analyser = null; }
}
const setVol = (p, v) => { v = Math.max(0, Math.min(1, v)); if (p._gain) p._gain.gain.value = v; else p.volume = v; };
function stopAll(){ for (const p of players) { p.pause(); p.removeAttribute('src'); p.load(); } fadingEl = null; }

function playList(list, i, shuf, from){
  if (!list.length) return;
  queue = list.slice();
  if (shuf) { for (let k = queue.length-1; k > 0; k--) { const j = Math.floor(Math.random()*(k+1)); [queue[k],queue[j]] = [queue[j],queue[k]]; } i = 0; }
  qi = Math.max(0, i);
  $('pFrom').textContent = 'Desde ' + (from || (view ? $('lName').textContent : 'Biblioteca'));
  load(true);
}
function load(autoplay, crossfade){
  const prevSong = current;
  current = queue[qi]; if (!current) return;
  setupGraph();
  if (actx && actx.state === 'suspended') actx.resume();
  if (crossfade && !el().paused) {
    // Mezcla: el actual se desvanece y el nuevo entra
    fadingEl = el(); active = 1 - active; fadeTarget = el();
    fadeTarget.src = urlFor(current); setVol(fadeTarget, 0);
    fadeTarget.play().catch(()=>{});
  } else {
    if (fadingEl) { fadingEl.pause(); fadingEl = null; }
    other().pause();
    el().src = urlFor(current); setVol(el(), 1);
    if (autoplay) el().play().catch(()=>{});
  }
  const pl = $('player'), cv = $('cover');
  if (prevSong && pl.classList.contains('open') && dir && !document.hidden) {
    cv.className = 'cover ' + (dir > 0 ? 'out-l' : 'out-r'); pl.classList.add('swap');
    setTimeout(() => { renderNow(); cv.className = 'cover ' + (dir > 0 ? 'in-l' : 'in-r'); pl.classList.remove('swap'); }, 220);
  } else { renderNow(); if (!prevSong) { $('mini').classList.remove('bounce'); void $('mini').offsetWidth; $('mini').classList.add('bounce'); } }
  dir = 0;
  native.meta(current); updateWidget(); saveResume();
}
function toggle(){
  if (!current) return lib().length ? playList(sorted(lib()),0) : pickFiles(null);
  if (el().paused) { if (actx && actx.state === 'suspended') actx.resume(); el().play(); }
  else { if (fadingEl) { fadingEl.pause(); fadingEl = null; setVol(el(), 1); } el().pause(); }
}
function nextIndex(){
  if (!queue.length) return -1;
  if (shuffle && queue.length > 1) { let n; do n = Math.floor(Math.random()*queue.length); while (n === qi); return n; }
  return qi + 1 < queue.length ? qi + 1 : (repeat ? 0 : -1);
}
function next(crossfade){
  if (!queue.length) return;
  let n = nextIndex(); if (n < 0) n = 0;
  qi = n; dir = 1; load(true, crossfade === true);
}
function prev(){
  if (!queue.length) return;
  if (el().currentTime > 3) { el().currentTime = 0; return; }
  dir = -1; qi = (qi - 1 + queue.length) % queue.length; load(true);
}
$('play').onclick = toggle; $('mPlay').onclick = toggle;
$('next').onclick = () => next(); $('mNext').onclick = () => next(); $('prev').onclick = prev;
$('lPlay').onclick = () => playList(viewSongs(view), 0);
$('lShuffle').onclick = () => playList(viewSongs(view), 0, true);
$('shuffle').onclick = e => { shuffle = !shuffle; e.currentTarget.className = 'ib ' + (shuffle?'on':'off'); toast(shuffle?'Aleatorio activado':'Aleatorio desactivado'); };
$('repeat').onclick = e => { repeat = !repeat; e.currentTarget.className = 'ib ' + (repeat?'on':'off'); toast(repeat?'Repetir lista':'Repetir desactivado'); };

const setIcons = p => document.querySelectorAll('.pi').forEach(x => { x.classList.add('bump'); setTimeout(()=>{ x.innerHTML = p ? PAUSE : PLAY; x.classList.remove('bump'); },120); });
let wasPlaying = false;
function syncPlaying(){
  const playing = !el().paused;
  if (playing === wasPlaying) return;
  wasPlaying = playing;
  setIcons(playing); document.body.classList.toggle('paused', !playing);
  native.state(playing ? 'playing' : 'paused'); updateWidget();
  if (playing) startViz();
}
for (const p of players) {
  p.addEventListener('play', () => { if (p === el()) syncPlaying(); });
  p.addEventListener('pause', () => { if (p === el()) syncPlaying(); saveResume(); });
  p.addEventListener('playing', () => { if (p === el()) console.log('REP play', current && current.title, p.src.slice(0,60)); });
  p.addEventListener('error', () => { if (p === el() && p.getAttribute('src')) { console.log('REP audio-error', p.error && p.error.code, p.src.slice(0,80)); toast('No se pudo reproducir esta canción'); } });
  p.addEventListener('loadedmetadata', () => { if (p === el()) { $('dur').textContent = fmt(p.duration); native.pos(); } });
  p.addEventListener('seeked', () => { if (p === el()) native.pos(); });
  p.addEventListener('ended', () => {
    if (p === fadingEl) { fadingEl = null; return; }
    if (p !== el()) return;
    const n = nextIndex();
    if (n < 0) { syncPlaying(); return; }
    qi = n; dir = 1; load(true);
  });
  p.addEventListener('timeupdate', () => {
    // Transición suave
    if (fadingEl && p === el()) {
      const cf = Math.max(1, settings.crossfade), k = Math.min(1, p.currentTime / cf);
      setVol(p, k); setVol(fadingEl, 1 - k);
      if (k >= 1) { fadingEl.pause(); fadingEl = null; }
    }
    if (p !== el()) return;
    const cf = settings.crossfade;
    if (cf > 0 && !fadingEl && p.duration && isFinite(p.duration) && p.duration > cf * 2 + 2 && p.duration - p.currentTime <= cf && !p.paused) {
      const n = nextIndex();
      if (n >= 0 && queue[n] !== current) { console.log('REP crossfade'); qi = n; dir = 1; load(true, true); return; }
    }
    const pct = p.duration ? p.currentTime / p.duration * 100 : 0;
    $('mProg').style.width = pct + '%';
    if (!dragging) { setBar(pct); $('cur').textContent = fmt(p.currentTime); }
    if (Date.now() - lastResume > 5000) saveResume();
  });
}
function setBar(p){ $('fill').style.width = p+'%'; $('knob').style.left = p+'%'; }
let dragging = false;
const bar = $('bar');
const pct = e => { const r = bar.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); };
bar.onpointerdown = e => { if (!el().duration) return; dragging = true; bar.setPointerCapture(e.pointerId); setBar(pct(e)*100); };
bar.onpointermove = e => { if (dragging) { setBar(pct(e)*100); $('cur').textContent = fmt(pct(e)*el().duration); } };
bar.onpointerup = e => { if (dragging) { el().currentTime = pct(e)*el().duration; dragging = false; } };

/* Recordar dónde te quedaste */
let lastResume = 0;
function saveResume(){ lastResume = Date.now(); if (current) ls.set('resume', {ids:queue.map(s=>s.id).slice(0,500), qi, t:el().currentTime||0}); }
function restoreResume(){
  const r = ls.get('resume', null); if (!r) return;
  const map = new Map(songs.map(s => [s.id, s]));
  queue = r.ids.map(id => map.get(id)).filter(Boolean); if (!queue.length) return;
  qi = Math.min(Math.max(0, r.qi), queue.length-1);
  current = queue[qi];
  el().src = urlFor(current);
  el().addEventListener('loadedmetadata', () => { try { el().currentTime = r.t || 0; } catch {} }, {once:true});
  renderNow(); native.meta(current); updateWidget();
}

/* ---------- Visualizador real ---------- */
const viz = $('viz'), vctx = viz.getContext('2d');
let vizOn = false, fakeT = 0;
function startViz(){ if (vizOn) return; vizOn = true; requestAnimationFrame(drawViz); }
function drawViz(){
  const open = $('player').classList.contains('open') && !document.hidden;
  if (!open) { vizOn = false; return; }
  const dpr = window.devicePixelRatio || 1, w = viz.clientWidth, h = viz.clientHeight;
  if (viz.width !== w*dpr) { viz.width = w*dpr; viz.height = h*dpr; }
  vctx.setTransform(dpr,0,0,dpr,0,0); vctx.clearRect(0,0,w,h);
  const N = 32, gap = 3, bw = (w - gap*(N-1)) / N;
  let data = null;
  if (analyser && settings.viz) { data = new Uint8Array(analyser.frequencyBinCount); analyser.getByteFrequencyData(data); }
  const playing = !el().paused; fakeT += .06;
  const acc = getComputedStyle(document.documentElement).getPropertyValue('--ac').trim() || '#161616';
  if (settings.accent === 'brand') { const gr = vctx.createLinearGradient(0,0,w,0); gr.addColorStop(0,'#FF9A5A'); gr.addColorStop(.5,'#EE4D7B'); gr.addColorStop(1,'#6F5BF5'); vctx.fillStyle = gr; }
  else vctx.fillStyle = acc;
  for (let i = 0; i < N; i++) {
    let v;
    if (data) { const idx = 1 + Math.floor(Math.pow(i / N, 1.7) * (data.length * .7)); v = data[idx] / 255; }
    else v = 0;   // sin análisis de audio real no se inventan ondas
    const bh = Math.max(3, v * h);
    vctx.globalAlpha = .35 + v * .65;
    const x = i * (bw + gap), y = (h - bh) / 2;
    vctx.beginPath(); vctx.roundRect ? vctx.roundRect(x, y, bw, bh, bw/2) : vctx.rect(x, y, bw, bh); vctx.fill();
  }
  vctx.globalAlpha = 1;
  requestAnimationFrame(drawViz);
}

/* ---------- Segundo plano: pantalla bloqueada, notificación y auriculares ---------- */
const isNative = !!window.Capacitor?.isNativePlatform?.();
const NativeMS = isNative ? window.Capacitor.registerPlugin('MediaSession') : null;
const artCache = new Map();
function artwork(s){
  if (s.art) return s.art;
  if (artCache.has(s.id)) return artCache.get(s.id);
  const c = document.createElement('canvas'); c.width = c.height = 512; const x = c.getContext('2d');
  x.fillStyle = songColor(s); x.fillRect(0,0,512,512);
  x.fillStyle = 'rgba(22,22,22,.22)'; x.font = '800 260px -apple-system,Roboto,sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(initials(s), 256, 276);
  const u = c.toDataURL('image/png'); artCache.set(s.id, u); return u;
}
const native = {
  meta(s){
    const m = {title:s.title, artist:s.artist, album:s.album || songFolders(s)[0]?.name || 'Reproductor', artwork:[{src:artwork(s), sizes:'512x512', type:s.art?'image/jpeg':'image/png'}]};
    try { if (NativeMS) NativeMS.setMetadata(m); else if ('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata(m); } catch {}
  },
  state(st){
    try { if (NativeMS) NativeMS.setPlaybackState({playbackState:st}); else if ('mediaSession' in navigator) navigator.mediaSession.playbackState = st; } catch {}
    this.pos();
  },
  pos(){
    const p = el(); if (!p.duration || !isFinite(p.duration)) return;
    const o = {duration:p.duration, position:Math.min(p.currentTime, p.duration), playbackRate:1};
    try { if (NativeMS) NativeMS.setPositionState(o); else navigator.mediaSession?.setPositionState?.(o); } catch {}
  }
};
/* Auriculares. Android convierte el doble toque en "siguiente"; si justo después llega un tercer toque
   (play/pausa) lo interpretamos como triple toque = anterior. Fuera de Android se cuentan los toques. */
let taps = 0, tapTimer = null, lastNextAt = 0;
function headsetTap(){
  taps++; clearTimeout(tapTimer);
  tapTimer = setTimeout(() => {
    const n = taps; taps = 0;
    if (n === 1) toggle();
    else if (n === 2) { console.log('REP headset doble'); next(); }
    else { console.log('REP headset triple'); prev(); }
  }, 450);
}
function tripleCheck(){
  if (Date.now() - lastNextAt < 800) { lastNextAt = 0; console.log('REP headset triple'); prev(); prev(); el().play().catch(()=>{}); return true; }
  return false;
}
const handlers = {
  play: () => { if (!isNative) return headsetTap(); if (!tripleCheck()) el().play(); },
  pause: () => { if (!isNative) return headsetTap(); if (!tripleCheck() && !el().paused) toggle(); },
  stop: () => el().pause(),
  nexttrack: () => { lastNextAt = Date.now(); console.log('REP accion siguiente'); next(); },
  previoustrack: () => prev(),
  seekto: d => { if (d && d.seekTime != null) { el().currentTime = d.seekTime; native.pos(); } },
  seekforward: () => { el().currentTime = Math.min(el().duration||0, el().currentTime + 10); },
  seekbackward: () => { el().currentTime = Math.max(0, el().currentTime - 10); }
};
for (const [action, fn] of Object.entries(handlers)) {
  try { if (NativeMS) NativeMS.setActionHandler({action}, fn); else navigator.mediaSession?.setActionHandler(action, fn); } catch {}
}
setInterval(() => { if (!el().paused) native.pos(); }, 5000);

/* ---------- Widget de pantalla de inicio ---------- */
const Lib = isNative ? window.Capacitor.registerPlugin('MusicLibrary') : null;
let widgetT, lastWidgetArt = '';
function updateWidget(){
  if (!Lib || !current) return;
  clearTimeout(widgetT);
  widgetT = setTimeout(() => {
    const artKey = current.id + ':' + (current.art ? current.art.length : 0);
    const o = {title:current.title, artist:current.artist, playing:!el().paused};
    if (artKey !== lastWidgetArt) { o.art = current.art || artwork(current); lastWidgetArt = artKey; }
    Lib.updateWidget(o)
      .then(() => console.log('REP widget ok')).catch(e => console.log('REP widget-error ' + e.message));
  }, 150);
}
if (Lib) Lib.addListener('widget', ({action}) => {
  console.log('REP widget-action ' + action);
  if (action === 'toggle') toggle();
  if (action === 'next') next();
  if (action === 'prev') prev();
});

/* ---------- Efectos ---------- */
document.addEventListener('pointerdown', e => {
  const t = e.target.closest('.song,.opt,.pill,.ib,.play,.folder'); if (!t || e.target.closest('[data-h]')) return;
  const r = t.getBoundingClientRect(), d = Math.max(r.width, r.height), sp = document.createElement('span');
  sp.className = 'ripple'; sp.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
  t.appendChild(sp); setTimeout(() => sp.remove(), 600);
});
(() => {
  const cv = $('cover'), pl = $('player'); let sx, sy, mode;
  cv.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; mode = null; }, {passive:true});
  cv.addEventListener('touchmove', e => {
    const dx = e.touches[0].clientX - sx, dy = e.touches[0].clientY - sy;
    if (!mode) mode = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    if (mode === 'x') cv.style.transform = `translateX(${dx}px) rotate(${dx/30}deg)`;
    else if (dy > 0) { pl.classList.add('dragging'); pl.style.transform = `translateY(${dy}px)`; }
  }, {passive:true});
  cv.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    cv.style.transform = ''; pl.classList.remove('dragging'); pl.style.transform = '';
    if (mode === 'x' && Math.abs(dx) > 70) dx < 0 ? next() : prev();
    if (mode === 'y' && dy > 120) closePlayer();
  });
})();
document.addEventListener('visibilitychange', () => { if (!document.hidden) { if (actx && actx.state === 'suspended' && !el().paused) actx.resume(); startViz(); } });

/* Botón atrás de Android */
history.pushState(null, '');
window.addEventListener('popstate', () => {
  history.pushState(null, '');
  if ($('sheet').classList.contains('show')) closeSheet();
  else if ($('player').classList.contains('open')) closePlayer();
  else if (view) closeList();
});
let tt;
function toast(m){ $('toast').textContent = m; $('toast').classList.add('show'); clearTimeout(tt); tt = setTimeout(() => $('toast').classList.remove('show'), 1900); }

/* ---------- Música del teléfono ---------- */
let scanning = false;
async function scanDevice(interactive){
  if (!Lib || scanning) return;
  scanning = true; $('scanCard').classList.add('busy'); $('scanT').textContent = 'Buscando música…'; $('scanS').textContent = 'Revisando tu teléfono';
  try {
    const r = await Lib.scan();
    if (!r.granted) { if (interactive) toast('Necesito permiso para ver tu música'); return; }
    const found = new Map(r.songs.map(d => ['dev:'+d.id, d]));
    let added = 0;
    for (const [id, d] of found) {
      if (hiddenIds.has(id)) continue;
      const ex = songs.find(s => s.id === id);
      if (ex) {
        const wa = isWA({...ex, path:d.path, file:d.file, duration:d.duration});
        if (ex.uri !== d.uri || ex.path !== d.path || ex.wa !== wa) { Object.assign(ex, {uri:d.uri, path:d.path, file:d.file, duration:d.duration, wa}); await put('songs', ex); }
        continue;
      }
      const s = {id, title:d.title || 'Sin título', artist:d.artist || UNKNOWN_ARTIST, album:d.album && d.album !== 'Music' && d.album !== 'Download' ? d.album : '', albumId:d.albumId, track:d.track||0, duration:d.duration, uri:d.uri, path:d.path||'', file:d.file||'', folders:[], added:(d.added||0)*1000};
      s.wa = isWA(s);
      await put('songs', s); songs.push(s); added++;
    }
    for (const s of songs.filter(s => s.uri && !found.has(s.id))) await del('songs', s.id);
    songs = songs.filter(s => !s.uri || found.has(s.id));
    console.log('REP scan ' + found.size + ' canciones, nuevas ' + added + ', whatsapp ' + waSongs().length);
    ls.set('scanned', 1);
    render(); animate($('vHome'));
    if (interactive || added) toast(added ? `${added} ${added===1?'canción encontrada':'canciones encontradas'}` : 'Tu biblioteca está al día');
  } catch (e) { console.log('REP scan-error ' + e.message); toast('No se pudo leer la música'); }
  finally { scanning = false; $('scanCard').classList.remove('busy'); updateScanCard(); }
}
function updateScanCard(){
  if (!Lib) return;
  const has = songs.some(s => s.uri);
  $('rescan').style.display = has ? '' : 'none';
  $('scanCard').style.display = has ? 'none' : '';
  $('scanT').textContent = 'Encontrar mi música'; $('scanS').textContent = 'Detecta las canciones guardadas en tu teléfono';
}
$('scanCard').onclick = () => scanDevice(true);
$('rescan').onclick = () => scanDevice(true);

let artBusy = false;
async function loadArtworks(){
  if (!Lib || artBusy) return; artBusy = true;
  let changed = false;
  try {
    for (const s of songs) {
      if (!s.uri || s.art !== undefined || s.customArt) continue;
      let data = null;
      try { data = (await Lib.artwork({uri:s.uri, albumId:s.albumId})).data || null; } catch {}
      s.art = data; await put('songs', s);
      if (data) {
        changed = true;
        document.querySelectorAll(`[data-art="${s.id}"]`).forEach(x => x.innerHTML = `<img src="${data}" alt="">`);
        if (current && current.id === s.id) { renderNow(); native.meta(s); updateWidget(); }
      }
    }
  } finally { artBusy = false; }
  if (changed) render();   // refresca álbumes y artistas con sus carátulas
}

(async () => {
  try {
    db = await openDB();
    let list; [list, folders] = await Promise.all([all('songs'), all('folders')]);
    for (const s of list) {
      let ch = false;
      if (!s.folders) { s.folders = s.folder ? [s.folder] : []; delete s.folder; ch = true; }
      const wa = isWA(s); if (s.wa !== wa) { s.wa = wa; ch = true; }
      if (ch) await put('songs', s);
    }
    hiddenIds = new Set(list.filter(s => s.hidden).map(s => s.id));
    songs = list.filter(s => !s.hidden);
    folders.sort((a,b)=>a.created-b.created);
  } catch { toast('No se pudo abrir el almacenamiento'); }
  render(); updateScanCard(); restoreResume();
  if (Lib) {
    try {
      const st = await Lib.status();
      if (st.granted) scanDevice(false);
      else if (!ls.get('scanned', 0) && !songs.length) setTimeout(() => scanDevice(true), 600);
    } catch {}
  }
})();
if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !isNative) navigator.serviceWorker.register('sw.js');
</script>
