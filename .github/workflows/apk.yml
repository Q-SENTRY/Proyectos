name: Construir APK
on:
  push:
    paths: ['reproductor-musica/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Preparar proyecto Android
        working-directory: reproductor-musica
        run: |
          npm install
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' $M
          grep -n "permission" $M
          D=android/app/src/main/java/com/qsentry/reproductor
          cp native/*.java $D/
          npx cap sync android
      - name: Compilar APK
        working-directory: reproductor-musica/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Probar en emulador Android
        continue-on-error: true
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: bash reproductor-musica/tests/emulator.sh
      - uses: actions/upload-artifact@v4
        with:
          name: reproductor-apk
          path: reproductor-musica/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Guardar APK y resultados en la rama
        if: always()
        run: |
          mkdir -p apk && cp reproductor-musica/android/app/build/outputs/apk/debug/app-debug.apk apk/Reproductor.apk || true
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add apk test-results 2>/dev/null; git commit -m "APK generado y resultados de prueba" && git push
