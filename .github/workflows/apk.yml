name: Construir APK
on:
  push:
    paths: ['reproductor-musica/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: reproductor-musica } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: reproductor-apk
          path: reproductor-musica/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Guardar APK en la rama
        working-directory: .
        run: |
          mkdir -p apk && cp reproductor-musica/android/app/build/outputs/apk/debug/app-debug.apk apk/Reproductor.apk
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add apk/Reproductor.apk && git commit -m "APK generado" && git push
